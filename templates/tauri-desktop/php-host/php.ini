; Bundled next to the FrankenPHP binary (confirmed via spike: PHP on Windows
; auto-discovers php.ini from the executable's own directory with no flag or
; env var needed). Without this, pdo_sqlite/sqlite3 are NOT loaded by default
; even though their DLLs ship in FrankenPHP's official Windows release —
; confirmed by a "could not find driver" PDOException without it.
extension_dir = "ext"
extension=pdo_sqlite
extension=sqlite3

; DemoCatalogApiHandler::validatedInput() calls mb_strlen() for name/
; description length validation — a real plugin dependency, found by
; actually running the create-item flow, not assumed up front.
extension=mbstring
