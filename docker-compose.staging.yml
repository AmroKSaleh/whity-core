# Staging stack for whity-core (WC-32, Sprint 4).
#
# A standalone, prod-like stack that runs ISOLATED from the dev demo:
#   * distinct project name        -> -p whity-staging
#   * distinct named volume        -> postgres_data_staging
#   * distinct container names      -> whity_staging_*
#   * NON-default host ports        -> frankenphp 8100, postgres 5433
# so it never collides with `docker compose up` (dev demo on :8000 / :5432).
#
# "Prod-like" means APP_ENV is NOT `development`, so the JWT_SECRET (>= 32 char)
# and ENCRYPTION_KEY fail-fast guards in public/index.php engage. Supply real
# secrets and seed passwords via an env file (see .env.staging.example).
#
# Usage (from repo root):
#   cp .env.staging.example .env.staging          # then edit the secrets
#   docker compose -p whity-staging \
#     -f docker-compose.staging.yml --env-file .env.staging up -d --build
#   ./scripts/init-staging-db.sh                   # migrate + seed
#   curl http://localhost:8100/api/health          # -> 200
#
# Tear down (keep volume):   docker compose -p whity-staging -f docker-compose.staging.yml down
# Tear down (wipe volume):   docker compose -p whity-staging -f docker-compose.staging.yml down -v

services:
  postgres:
    # pgvector/pgvector:pg15 — stock postgres:15 plus the `vector` extension, so
    # a plugin can declare a vector column for similarity search. The extension
    # is AVAILABLE, not enabled: a plugin still runs
    # `CREATE EXTENSION IF NOT EXISTS vector` in its own migration, so a
    # deployment that wants none carries none.
    #
    # UPGRADING AN EXISTING DATABASE NEEDS A REINDEX. This image is Debian
    # (glibc); postgres:15-alpine was musl, and the two sort text differently:
    #
    #     musl  -> Banana, Cherry, apple, date
    #     glibc -> apple, Banana, Cherry, date
    #
    # Same data, same collation name (en_US.utf8), different order. Postgres
    # does NOT warn, because musl records no collation version for it to
    # compare against — so every index on a text column is silently wrong until
    # rebuilt. On an existing volume, run `REINDEX DATABASE <name>;` once after
    # the swap. A fresh database is unaffected.
    image: pgvector/pgvector:pg15
    container_name: whity_staging_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-whity}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set for staging}
      POSTGRES_DB: ${DB_NAME:-whity_core}
    ports:
      # Non-default host port so it never collides with the dev demo on 5432.
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-whity} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frankenphp:
    build:
      context: .
      dockerfile: Dockerfile
      # Staging mirrors dev: runtime-only stage + the bind-mounted checkout.
      # The `release` stage (code baked in) is for the GHCR image only.
      target: base
    container_name: whity_staging_frankenphp
    ports:
      # Non-default host port so it never collides with the dev demo on 8000.
      - "${APP_PORT_HOST:-8100}:80"
    environment:
      # Prod-like: NOT `development`, so JWT/ENCRYPTION guards fail fast on weak secrets.
      APP_ENV: ${APP_ENV:-staging}
      DB_USER: ${DB_USER:-whity}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set for staging}
      DB_NAME: ${DB_NAME:-whity_core}
      DB_HOST: postgres
      # In-network Postgres always listens on 5432; only the host mapping changes.
      DB_PORT: 5432
      # Connection-pool knobs for the persistent FrankenPHP workers (WC-21).
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME:-1800}
      DB_PING_INTERVAL: ${DB_PING_INTERVAL:-5}
      # MUST be >= 32 chars outside development or the worker refuses to boot.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (>= 32 chars) for staging}
      # MUST be set outside development (AES-256-CBC key for stored TOTP secrets).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set for staging}
      # Document/label designer server-side render tier (ADR 0012). Optional —
      # only meaningful when BOTH the `render` profile is started AND the
      # documents.render_enabled setting is turned on; left unset/empty here is
      # fine for a staging run that never uses it (the render endpoint 503s
      # cleanly). Must match the render service's own secret when both are set.
      RENDER_SERVICE_URL: ${RENDER_SERVICE_URL:-http://render:8130}
      RENDER_SHARED_SECRET: ${RENDER_SHARED_SECRET:-}
      # Explicit CORS allowlist (never a wildcard); reflected back with credentials.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3100}
      # Seed/system-admin passwords consumed by `seed` / migration 010.
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD must be set for staging}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:?INITIAL_USER_PASSWORD must be set for staging}
      INITIAL_SYSTEM_ADMIN_PASSWORD: ${INITIAL_SYSTEM_ADMIN_PASSWORD:?INITIAL_SYSTEM_ADMIN_PASSWORD must be set for staging}
      INITIAL_SUPERUSER_PASSWORD: ${INITIAL_SUPERUSER_PASSWORD:?INITIAL_SUPERUSER_PASSWORD must be set for staging}
      # Address of the bootstrap administrator (WC-779). Optional, unlike the
      # passwords above: empty keeps the historical system@whity.local default.
      INITIAL_SYSTEM_ADMIN_EMAIL: ${INITIAL_SYSTEM_ADMIN_EMAIL:-}
      CADDY_GLOBAL_OPTIONS: "auto_https off"
      SERVER_NAME: ":80"
      SERVER_ROOT: "public/"
      # Prod-like worker pool sizing; override per load-test scenario.
      FRANKENPHP_WORKERS: ${FRANKENPHP_WORKERS:-8}
      FRANKENPHP_TIMEOUT: ${FRANKENPHP_TIMEOUT:-60s}
      MAX_REQUESTS: ${MAX_REQUESTS:-500}
      # Master switch for the /mcp JSON-RPC transport (per-tenant mcp.enabled
      # opt-in still applies on top). Off unless explicitly enabled.
      MCP_ENABLED: ${MCP_ENABLED:-false}
      # Public base URL of the deployment. REQUIRED for absolute URLs the backend
      # cannot derive behind a reverse proxy — notably the SSO/OIDC redirect_uri:
      # unset, the callback is emitted relative and providers reject the flow with
      # invalid_request. Set to the externally-reachable origin (e.g. the tunnel/
      # proxy host), not the in-container bind.
      APP_URL: ${APP_URL:-}
    volumes:
      # Serve the committed tree (mirrors the dev compose bind mount). The app
      # writes a plugin-manifest cache + sqlite scratch file under /app at runtime,
      # so this stays writable; only the Caddyfile is pinned read-only.
      - .:/app
      - ./Caddyfile:/etc/frankenphp/Caddyfile:ro
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app

  # Document/label designer server-side render tier (ADR 0012 / WC-docdesigner
  # Track 2) — mirrors the dev compose `render` service (see docker-compose.yml
  # for the full rationale). Opt-in: `docker compose -p whity-staging -f
  # docker-compose.staging.yml --profile render up -d --build`. There is no
  # insecure dev fallback for the secret here — staging is prod-like — but the
  # `:?` fail-fast guard used for the secrets above cannot be used for it:
  # Compose interpolates EVERY service in the file, profile or no profile, so
  # `:?` made every plain `-f docker-compose.staging.yml` command (including
  # `config`, `ps` and a two-tier `up`) fail on a service it was never asked to
  # start. The service enforces it instead — it warns loudly at boot and
  # refuses every POST /render with 401 until the secret is >= 32 chars.
  render:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: whity_staging_render
    environment:
      PORT: "8130"
      RENDER_SHARED_SECRET: ${RENDER_SHARED_SECRET:-}
    ports:
      - "${RENDER_PORT_HOST:-8130}:8130"
    profiles:
      - render
    restart: unless-stopped

  # Service-health collector behind the public /status page (WC-status-page).
  #
  # In the DEFAULT staging stack, deliberately — unlike the dev compose, where
  # it is profile-gated so `docker compose up --wait` in the e2e job does not
  # gate readiness on a long-running loop. Staging is the deployment this
  # exists for: it lost three days to an outage nobody saw, because the only
  # thing that could have noticed was the thing that was down. A monitor you
  # have to remember to enable is a monitor that is off on the day you need it.
  #
  # WHITY_PUBLIC_URL must be the PUBLIC origin, not the internal service name:
  # probing http://frankenphp would exercise only the app container and miss
  # exactly what broke last time — the web tier and the Cloudflare tunnel in
  # front of it. Falls back to APP_URL (the same public origin) so a bare `up`
  # still collects something rather than silently probing nothing.
  #
  # NOT APP_PORT_HOST: that is a BIND ADDRESS (e.g. `127.0.0.1:8100`), not a
  # bare port, so `http://localhost:${APP_PORT_HOST}` expands to the malformed
  # `http://localhost:127.0.0.1:8100`. Every probe then fails instantly and the
  # public status page reports api/web DOWN while both serve 200 — a status
  # page crying wolf is worse than none.
  health-watch:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: whity_staging_health_watch
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DB_USER: ${DB_USER:-whity}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set for staging}
      DB_NAME: ${DB_NAME:-whity_core}
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (>= 32 chars) for staging}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set for staging}
      WHITY_PUBLIC_URL: ${WHITY_PUBLIC_URL:-${APP_URL:-http://localhost:8100}}
      WHITY_RENDER_URL: ${RENDER_SERVICE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped
    # Override the FrankenPHP base image's inherited HEALTHCHECK, which curls
    # the admin endpoint on localhost:2019 — a port that does not exist in a
    # container running a CLI collector loop. It reported UNHEALTHY forever
    # while collecting perfectly, and a red that is always red trains everyone
    # to ignore the column, so the day it means something nobody sees it.
    #
    # The replacement asserts the one thing this container is for: that THIS
    # PROCESS is still writing samples. It reads the heartbeat the collector
    # updates after every pass — not `health_samples`, which is shared and
    # append-only and therefore stays fresh on somebody else's rows while this
    # container records nothing. See ops/health-watch-healthcheck.php for the
    # full reasoning; the short version is that the probe has to be able to say
    # "I have recorded nothing", and a query over a shared table cannot.
    healthcheck:
      test: ["CMD", "php", "/app/ops/health-watch-healthcheck.php"]
      interval: 60s
      timeout: 15s
      retries: 3
      # The first pass runs at startup, but Postgres may still be coming up
      # behind it; do not judge the container before it has had a chance to
      # write anything.
      start_period: 120s
    # `exec`, deliberately. The previous form was
    #   php ... || echo "[health-watch] exited (code $$?); restarting"
    # which announced a restart that nothing performed, and swallowed the exit
    # code on the way: the shell then exited 0, so a crashed collector left
    # behind a clean-looking shutdown. With exec, php IS the container process —
    # its exit status is the container's, `restart: unless-stopped` acts on a
    # real failure, and nothing claims to have done something it did not do.
    command:
      - sh
      - -c
      - |
        echo "[health-watch] service-health collector started";
        exec php public/index.php health:watch --interval=60

volumes:
  # Distinct named volume so staging data never mixes with the dev demo's.
  postgres_data_staging:
