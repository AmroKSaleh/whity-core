services:
  postgres:
    image: postgres:15-alpine
    container_name: whity_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-whity}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-whity_dev}
      POSTGRES_DB: ${DB_NAME:-whity_core}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-whity} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frankenphp:
    build:
      context: .
      dockerfile: Dockerfile
      # Dev builds the runtime-only stage; the checkout is bind-mounted below.
      # The `release` stage (code baked in) is for the GHCR image only.
      target: base
    image: whity-core:dev
    container_name: whity_frankenphp
    ports:
      - "8000:80"
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Public base URL of the app — used to build the SSO OAuth redirect_uri and
      # email-verification links. Dev default targets the Next proxy on :3000.
      APP_URL: ${APP_URL:-http://localhost:3000}
      DB_USER: ${DB_USER:-whity}
      DB_PASSWORD: ${DB_PASSWORD:-whity_dev}
      DB_NAME: ${DB_NAME:-whity_core}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      # Connection pooling for persistent FrankenPHP workers (WC-21).
      # DB_CONNECT_TIMEOUT: seconds to wait when (re)opening a PostgreSQL socket.
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      # DB_MAX_LIFETIME: seconds before a worker recycles its connection. Kept
      # well below typical server idle timeouts so connections are refreshed
      # before the server can drop them. Default 30 minutes.
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME:-1800}
      # DB_PING_INTERVAL: minimum seconds between "SELECT 1" health checks before
      # a query. Throttles liveness checks so a hot worker is not pinged on every
      # request while still catching connections that died while the worker idled.
      DB_PING_INTERVAL: ${DB_PING_INTERVAL:-5}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      # ENCRYPTION_KEY: secret used to AES-256-CBC encrypt stored TOTP 2FA secrets (WC-95).
      # MUST be identical across setup/confirm and login so encrypt/decrypt use the same key.
      # The dev default below is for local use only; outside APP_ENV=development the app fails fast
      # if this is unset/empty (mirroring JWT_SECRET). Override in production with a strong secret.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_change_in_production}
      # Document/label designer server-side render tier (ADR 0012). In-network
      # base URL of the opt-in `render` compose service below; only reachable
      # (and only ever called) when documents.render_enabled is ALSO true — see
      # SettingsRegistry. RENDER_SHARED_SECRET must match the render service's
      # own value (dev default below is for local use only, like JWT_SECRET).
      RENDER_SERVICE_URL: ${RENDER_SERVICE_URL:-http://render:8130}
      RENDER_SHARED_SECRET: ${RENDER_SHARED_SECRET:-dev_render_shared_secret_change_in_production}
      CADDY_GLOBAL_OPTIONS: "auto_https off"
      SERVER_NAME: ":80"
      SERVER_ROOT: "public/"
      FRANKENPHP_WORKERS: ${FRANKENPHP_WORKERS:-8}
      FRANKENPHP_TIMEOUT: ${FRANKENPHP_TIMEOUT:-60s}
      MAX_REQUESTS: ${MAX_REQUESTS:-500}
      # Bootstrap/seed identity, mirrored from db-init below. The app itself
      # never reads these — but `docker exec whity_frankenphp php
      # public/index.php migrate run|seed` is the flow the README and the
      # go-live checklist document, and enumerated-only compose environments
      # mean a variable absent here is a variable that silently does not exist
      # for that command (WC-779: the whole point of INITIAL_SYSTEM_ADMIN_EMAIL
      # is defeated if setting it in .env cannot reach the process that applies
      # it). Same defaults as db-init so both paths bootstrap identically.
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin123}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-user123}
      INITIAL_SYSTEM_ADMIN_PASSWORD: ${INITIAL_SYSTEM_ADMIN_PASSWORD:-systemadmin123}
      INITIAL_SUPERUSER_PASSWORD: ${INITIAL_SUPERUSER_PASSWORD:-superuser123}
      INITIAL_SYSTEM_ADMIN_EMAIL: ${INITIAL_SYSTEM_ADMIN_EMAIL:-}
    volumes:
      - .:/app
      - ./Caddyfile:/etc/frankenphp/Caddyfile
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    working_dir: /app

  # Scheduled maintenance (WC-188). A dedicated long-running container that runs
  # the revoked_tokens:cleanup cron on a schedule, so the cleanup is GENUINELY
  # wired into the running stack — not merely documented. It reuses the same
  # whity-core:dev image and bind-mounts the checkout, waits for the one-shot
  # db-init to finish, then loops: prune expired revocations, then sleep ~24h.
  # A lightweight sleep loop (rather than a system crond) keeps the container
  # single-purpose and its log readable via `docker compose logs cron`. The job
  # is idempotent and safe to run any time — it only deletes already-expired
  # rows. Staging/production schedule the SAME command via their own scheduler
  # (see docs/wiki/Cron-Operations.md).
  cron:
    image: whity-core:dev
    container_name: whity_cron
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-whity_core}
      DB_USER: ${DB_USER:-whity}
      DB_PASSWORD: ${DB_PASSWORD:-whity_dev}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_change_in_production}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    working_dir: /app
    # Opt-in auxiliary service: run with `docker compose --profile cron up`.
    # Kept out of the DEFAULT stack so `docker compose up --wait` (used by the
    # e2e job) does not try to gate readiness on a long-running maintenance
    # loop — `--wait` errors on such a service whether it has the base image's
    # (HTTP) healthcheck (reports "unhealthy") or none ("no healthcheck
    # configured"). Scheduling for staging/production is the orchestrator's job
    # (see docs/wiki/Cron-Operations.md); this service is a dev convenience.
    profiles:
      - cron
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        echo "[cron] revoked-tokens cleanup scheduler started (daily)";
        while true; do
          echo "[cron] $$(date -u +%FT%TZ) running revoked-tokens:cleanup";
          php public/index.php revoked-tokens:cleanup || echo "[cron] cleanup failed (will retry next cycle)";
          sleep 86400;
        done

  # Durable async job worker (WC-627). Runs the queue:work loop that reserves
  # and processes jobs from the `jobs` table. The command loops internally and
  # recycles (clean exit) on its memory ceiling / --max-runtime, so
  # `restart: unless-stopped` respawns a fresh process — bounding memory in the
  # persistent worker. Opt-in (like `cron`): `docker compose --profile queue up`.
  # Scale with `--scale queue-worker=N` — each claims distinct jobs (Postgres
  # FOR UPDATE SKIP LOCKED). Kept out of the DEFAULT stack for the same reason as
  # cron (a long-running loop breaks `docker compose up --wait`). Staging/prod
  # run the same command under their orchestrator (see docs/wiki/Cron-Operations.md).
  queue-worker:
    image: whity-core:dev
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-whity_core}
      DB_USER: ${DB_USER:-whity}
      DB_PASSWORD: ${DB_PASSWORD:-whity_dev}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_change_in_production}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    working_dir: /app
    profiles:
      - queue
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        echo "[queue-worker] durable job worker started";
        php public/index.php queue:work --max-runtime=3600 || echo "[queue-worker] exited (code $$?); restarting";

  # Cron-tick scheduler (WC-scheduler). Runs the schedule:run loop that, once per
  # minute, enqueues every DUE scheduled_jobs row onto the queue and prunes
  # retained completed jobs. Exactly-once-per-minute ACROSS workers via the
  # shared-store tick lock, so running MULTIPLE replicas (or one alongside
  # staging/prod) never double-fires. Opt-in (like `cron`/`queue`):
  # `docker compose --profile scheduler up`. Recycles on --max-runtime so
  # `restart: unless-stopped` respawns a fresh process. Kept out of the DEFAULT
  # stack (a long-running loop breaks `docker compose up --wait`).
  scheduler:
    image: whity-core:dev
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-whity_core}
      DB_USER: ${DB_USER:-whity}
      DB_PASSWORD: ${DB_PASSWORD:-whity_dev}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_change_in_production}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    working_dir: /app
    profiles:
      - scheduler
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        echo "[scheduler] cron-tick scheduler started";
        php public/index.php schedule:run --max-runtime=3600 || echo "[scheduler] exited (code $$?); restarting";

  # Service-health collector behind the public /status page (WC-status-page).
  #
  # Runs as its OWN container, and that is the whole point. An in-app probe can
  # measure the database, queue and scheduler, but it can never record the app
  # being DOWN — if frankenphp is not serving, nothing inside it runs and the
  # last sample just goes stale. This deployment already lost three days to
  # exactly that: the web tier and tunnel were dead and the only thing that
  # could have noticed was the thing that was down.
  #
  # So this process probes the internal components AND fetches WHITY_PUBLIC_URL
  # over real HTTP from outside the app, writing straight to Postgres — so it
  # keeps recording while the app tier is unreachable. It shares the image (one
  # build, one migration set) but not frankenphp's fate.
  #
  # NOT a substitute for an off-host check: if the host or Docker dies, so does
  # this. Pair it with a Cloudflare health check against the public URL.
  #
  # Profile-gated HERE ONLY, for the same reason `cron`/`queue`/`scheduler` are:
  # `docker compose up --wait` (the e2e job) errors on a long-running loop
  # service whether it carries the base image's HTTP healthcheck (reports
  # "unhealthy") or none at all ("no healthcheck configured"). This file is the
  # dev/e2e stack, where a status collector has nothing to watch anyway.
  #
  # Where it MATTERS it is NOT opt-in: docker-compose.staging.yml runs it in the
  # default stack, because a monitor you have to remember to enable is a monitor
  # that is off on the day you need it — which is exactly how this deployment
  # lost three days.
  health-watch:
    image: whity-core:dev
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-whity_core}
      DB_USER: ${DB_USER:-whity}
      DB_PASSWORD: ${DB_PASSWORD:-whity_dev}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_change_in_production}
      # Probed over HTTP from outside the app. Defaults to the local frankenphp
      # service; set it to the PUBLIC origin in staging/production so the check
      # exercises the tunnel and web tier too, which is where the outage was.
      WHITY_PUBLIC_URL: ${WHITY_PUBLIC_URL:-http://frankenphp}
      WHITY_RENDER_URL: ${WHITY_RENDER_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    working_dir: /app
    profiles:
      - health
    restart: unless-stopped
    # Same override, and for the same reason, as docker-compose.staging.yml —
    # without it this container inherits the FrankenPHP base image's
    # `curl localhost:2019` probe, which is red forever in a CLI container and
    # so can never distinguish a collector that stopped from one that never
    # could. The probe asserts THIS process's own heartbeat; see
    # ops/health-watch-healthcheck.php.
    healthcheck:
      test: ["CMD", "php", "/app/ops/health-watch-healthcheck.php"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    # exec: php becomes the container process, so a crash is a non-zero
    # container exit that `restart: unless-stopped` acts on, instead of a shell
    # that prints "restarting" and exits 0 having restarted nothing.
    command:
      - sh
      - -c
      - |
        echo "[health-watch] service-health collector started";
        exec php public/index.php health:watch --interval=60

  # Document/label designer server-side render tier (ADR 0012 / WC-docdesigner
  # Track 2): Node + Puppeteer/headless Chromium loading the SAME React
  # renderer the browser preview uses (print-document.tsx) so exported PDFs
  # stay pixel-parity with the designer, not a second hand-rolled renderer.
  # Deliberately OPT-IN (like `cron`/`queue`/`scheduler`): render load is
  # bursty/seasonal (a whole cohort's labels exported at once) and Chromium is
  # heavy, so a minimal sovereign deploy omits this profile entirely and the
  # core render endpoint degrades to a clean 503 when it is absent. The core
  # service ALSO gates on the documents.render_enabled setting (default off)
  # independent of whether this container happens to be running — run
  # `docker compose --profile render up` to include it. RENDER_SHARED_SECRET
  # MUST match the frankenphp service's value above.
  render:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    image: whity-render:dev
    container_name: whity_render
    environment:
      PORT: "8130"
      RENDER_SHARED_SECRET: ${RENDER_SHARED_SECRET:-dev_render_shared_secret_change_in_production}
    ports:
      - "${RENDER_PORT_HOST:-8130}:8130"
    profiles:
      - render
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8130/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Local SMTP sink for email testing (WC-email). Mailpit captures every message
  # the app sends so nothing leaves the machine — SMTP on :1025, a web inbox on
  # http://localhost:8025. Part of the default stack (with a healthcheck so
  # `docker compose up --wait` — used by the e2e job — waits for it cleanly), so
  # email "just works" in dev and the send-test e2e has a sink.
  #
  # Point the instance at it via the admin Email settings (or the settings API):
  # transport=smtp, host=mailpit, port=1025, encryption=none, any from_address.
  # No auth/password needed. Messages appear in the :8025 inbox. NOTE: inside the
  # compose network the SMTP host is the service name `mailpit`, not `localhost`
  # (the backend, not your browser, opens the SMTP connection).
  mailpit:
    image: axllent/mailpit:latest
    container_name: whity_mailpit
    ports:
      - "1025:1025"  # SMTP submission (host=mailpit inside the compose network)
      - "8025:8025"  # web inbox UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Dev-only one-shot bootstrap (#174): on `docker compose up`, wait for Postgres then —
  # only when APP_ENV=development — run migrations + seed so a fresh/empty dev DB is
  # immediately usable (no manual `make setup`). Idempotent: migrations are IF NOT EXISTS
  # and seed is ON CONFLICT, so re-running `up` on a populated DB is a no-op (seed-if-empty,
  # never overwrite). Runs in its own container before the worker pool starts, so it never
  # races the 8 FrankenPHP workers. Staging/production do NOT use this file (see
  # docker-compose.staging.yml) and bootstrap via an explicit migrate+seed deploy step.
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: whity-core:dev
    container_name: whity_db_init
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-whity_core}
      DB_USER: ${DB_USER:-whity}
      DB_PASSWORD: ${DB_PASSWORD:-whity_dev}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_change_in_production}
      # Deterministic dev credentials (development only; override via env if desired).
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin123}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-user123}
      INITIAL_SYSTEM_ADMIN_PASSWORD: ${INITIAL_SYSTEM_ADMIN_PASSWORD:-systemadmin123}
      # Seeds the system-tenant (id 0) superuser superuser@example.com.
      INITIAL_SUPERUSER_PASSWORD: ${INITIAL_SUPERUSER_PASSWORD:-superuser123}
      # Address of the bootstrap administrator (WC-779). Left empty so the
      # historical system@whity.local default applies unless an operator sets it.
      INITIAL_SYSTEM_ADMIN_EMAIL: ${INITIAL_SYSTEM_ADMIN_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    restart: "no"
    command:
      - sh
      - -c
      - |
        if [ "$$APP_ENV" = "development" ]; then
          echo "[db-init] bootstrapping development database...";
          php public/index.php migrate run && php public/index.php seed;
        else
          echo "[db-init] skipped (APP_ENV=$$APP_ENV, not development)";
        fi

volumes:
  postgres_data:
