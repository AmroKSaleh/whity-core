name: E2E

# Doc-only changes can't affect the running stack or the E2E suite, so skip it
# when every changed path is documentation. `paths-ignore` only suppresses a run
# when ALL changed files match — a PR that touches both code and docs still runs.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# A newer push to the same ref obsoletes the in-flight run; never queue two.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filtering lives HERE rather than on the workflow triggers.
  #
  # `paths-ignore` at the trigger level means a docs-only PR produces no check
  # runs at all — and a required check that never reports blocks the PR
  # forever. Filtering per job keeps the shards cheap on a docs-only change
  # while still reporting a verdict branch protection can require.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - '!(docs/**|**/*.md|LICENSE)'

  e2e:
    # Keep this `/4`, the matrix below and the `--shard=` flag at the bottom in
    # step with each other — Playwright derives the split from the flag, the
    # other two only label it.
    name: Playwright shard ${{ matrix.shard }}/4
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      # Widened from 3 to 4 (WC-ci-wallclock). A shard measured ~5m50s, of which
      # ~2m25s is fixed setup (compose up, npm ci, browser restore) and ~3m25s is
      # the tests themselves; a fourth runner splits the variable part four ways
      # while the fixed part stays constant, so this workflow keeps finishing
      # inside the now-much-shorter Automated Tests run rather than becoming the
      # new critical path.
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The dev compose file bind-mounts this checkout into the containers and
      # its one-shot db-init service runs `php public/index.php migrate run`,
      # which needs vendor/autoload.php — and vendor/ is gitignored. Provision
      # PHP + Composer on the runner BEFORE compose up so the bind-mounted
      # checkout carries vendor/ into the containers (the suite's TOTP helper
      # also requires /app/vendor/autoload.php via docker exec).
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pgsql, pdo_pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Pull postgres:15-alpine before compose up so Docker Hub flakiness
      # (rate-limit / transient auth timeout) can be retried independently.
      # Three attempts with a backoff are enough to ride out brief outages
      # without burning the 25-minute job timeout on a single hung pull.
      - name: Pull Docker base images (with retry)
        run: |
          for i in 1 2 3; do
            docker pull postgres:15-alpine && break
            echo "Pull attempt $i failed — retrying in 15s..."
            sleep 15
          done

      # The dev compose file builds whity-core:dev from the Dockerfile `base`
      # target and bind-mounts the checkout. With the APP_ENV=development
      # default, the one-shot db-init service runs migrations + seed before
      # the worker pool starts, so the stack comes up with the deterministic
      # accounts the suite expects (admin123 / user123 compose defaults).
      - name: Start the backend stack
        run: docker compose -f docker-compose.yml up -d --wait

      # `--wait` covers container/healthcheck state, not end-to-end readiness
      # of the HTTP surface; poll the health endpoint until the API answers.
      - name: Wait for the backend API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Backend healthy after ~$(( i * 2 ))s"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy within 120s" >&2
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail 100
          exit 1

      # setup-node v5 (issue #198 tracks aligning the other workflows' v4).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          # Single lockfile at the workspace root (npm workspaces).
          cache-dependency-path: package-lock.json

      # npm workspaces install from the root lockfile; the Playwright steps below
      # still run with working-directory: web (bins resolve from the hoisted root
      # node_modules and the config is loaded from web/).
      - name: Install dependencies
        working-directory: .
        run: npm ci

      # Playwright browser binaries are versioned by the @playwright/test
      # release and live in ~/.cache/ms-playwright. Cache them keyed on that
      # version — deliberately with NO shard component — so every shard reuses
      # one download instead of fetching Chromium independently on every run.
      # (Widening the matrix must never widen this key.) The key changes only when
      # @playwright/test is bumped, so the cache refreshes exactly when the
      # browser actually changes (a calendar TTL would re-download daily for
      # nothing); GitHub also evicts caches untouched for 7 days, so a quiet
      # repo re-warms on its own.
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: web
        run: echo "version=$(node -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # `playwright install-deps` shells out to apt. GitHub's noble runners front
      # the archive with a fast azure-local mirror (azure.archive.ubuntu.com) that
      # intermittently goes dark; with apt's default long timeouts a dead mirror
      # makes `apt-get update` hang through several retries and blows the 25-minute
      # job cap (WC-ci-e2e-flake — a shard was CANCELLED at 25m on exactly this).
      # Bound apt's per-request timeout so a dead mirror fails fast to the public
      # fallback instead of stalling, and force IPv4 (Azure runners intermittently
      # hang on the mirror's IPv6 route). Applied once for both install paths below.
      - name: Harden apt against transient CI mirror failures
        run: |
          # 1) Route apt OFF the azure-local mirror to the canonical archive.
          #    azure.archive.ubuntu.com intermittently black-holes (a silent hang
          #    with no timeout — the shard sat 22 min then hit the 25-min cap), so
          #    rewrite it out of the runner's mirror list and sources entirely
          #    rather than letting apt discover it is dead on every run.
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo find /etc/apt/sources.list.d -type f -exec sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} + 2>/dev/null || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list 2>/dev/null || true
          # 2) Bound apt's per-request timeout + force IPv4 as a backstop so any
          #    remaining flaky route fails fast to the fallback instead of stalling.
          printf 'Acquire::http::Timeout "12";\nAcquire::https::Timeout "12";\nAcquire::Retries "1";\nAcquire::ForceIPv4 "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-mirror-timeouts

      # Cache miss: install the browser plus its OS-level dependencies. Cache
      # hit: the binaries are already restored, so only (re)install the system
      # deps — those are apt packages that live outside the cached directory.
      # Both shell out to apt, so wrap in a bounded retry to ride out a transient
      # mirror blip rather than failing the whole shard on it.
      - name: Install Playwright Chromium + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "install --with-deps attempt $i failed — retrying in 10s..."; sleep 10
          done
          exit 1

      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: |
          for i in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "install-deps attempt $i failed — retrying in 10s..."; sleep 10
          done
          exit 1

      # The Playwright config starts the Next dev server itself (webServer on
      # port 3010) and proxies /api/* to the stack at localhost:8000.
      - name: Run the E2E suite (shard ${{ matrix.shard }}/4)
        working-directory: web
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # ONE verdict branch protection can require, mirroring `CI gate` in
  # automated-tests.yml.
  #
  # The four shards are a matrix, so their check names carry the shard number,
  # and a docs-only PR skips them entirely — neither is something a required
  # check can name reliably. This job always runs, depends on all of them, and
  # reports once. A SKIPPED shard is a pass; that is the path filter working.
  #
  # Adding a job above? Add it to `needs` here, or it is not covered.
  e2e-gate:
    name: E2E gate
    if: always()
    needs:
      - changes
      - e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Without this, adding a job above and forgetting to list it in `needs`
      # silently drops it from the protected gate: it still runs, still goes
      # red, and merging is no longer blocked by it. That is the failure this
      # job exists to prevent, so it is checked rather than trusted.
      - name: The gate must cover every job in this workflow
        run: |
          python3 - <<'PYEOF'
          import sys, yaml
          d = yaml.safe_load(open('.github/workflows/e2e.yml'))
          jobs = set(d['jobs']) - {'e2e-gate'}
          needs = set(d['jobs']['e2e-gate']['needs'])
          missing = sorted(jobs - needs)
          if missing:
              for j in missing:
                  print(f"::error::job '{j}' is not in the E2E gate's `needs`, so branch protection does not cover it")
              sys.exit(1)
          print(f"gate covers all {len(jobs)} job(s)")
          PYEOF

      - name: Every required job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          bad = sorted(n for n, v in results.items() if v['result'] not in ('success', 'skipped'))
          for n, v in sorted(results.items()):
              print(f"  {n}: {v['result']}")
          if bad:
              print("::error::E2E gate failed — these jobs did not pass:")
              for n in bad:
                  print(f"::error::  {n}")
              sys.exit(1)
          print("E2E gate passed.")
          PYEOF
