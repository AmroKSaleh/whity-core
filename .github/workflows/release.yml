# Release pipeline (WC-172): pushing a tag `vX.Y.Z` publishes a core release.
#
# Gates, in order:
#   1. verify / postgres-integration / web — full parity with the PR gate
#      (.github/workflows/automated-tests.yml): the tag name must equal
#      `v` + CoreVersion::VERSION (a release can never ship with a lying
#      version), the full backend suite + static analysis + plugin smoke must
#      pass, migrations + seed must run on real PostgreSQL, and the frontend
#      types/tests/generated-artifact drift checks must pass on the tagged
#      commit. A release is never gated weaker than a PR.
#   2. image — build ALL THREE production container images and push them to
#      GHCR under the same tags (vX.Y.Z and latest): the backend
#      (`ghcr.io/<repo>`, root Dockerfile `release` stage — code + no-dev
#      vendor baked in), the frontend (`ghcr.io/<repo>/web`, web/Dockerfile
#      `runtime` stage — the built Next app) and the document render tier
#      (`ghcr.io/<repo>/render`, render-service/Dockerfile `runtime` stage —
#      headless Chromium plus the designer's own renderer bundled from source).
#      A deployment is not the product without the first two, so they ship
#      together or not at all. The render tier is optional to RUN (a compose
#      profile most deployments never start) but not optional to PUBLISH: its
#      build context spans the app repo AND the web source, so it is the one
#      image nobody downstream of this workflow can assemble from what we
#      publish — see the `image` job and docs/wiki/Document-Render-Service.md.
#   3. release — create the GitHub Release with auto-generated notes (the
#      source archives GitHub attaches are the deploy artifact for
#      checkout-based hosts; the GHCR images serve container-based ones).
#
# Consumers check for updates with `php public/index.php update:check` and
# apply them via docs/wiki/Core-Update.md.
name: Release

on:
  push:
    # Two entry points, one pipeline.
    #
    #   branches: [main]  the NORMAL path. Merging the develop -> main release
    #                     PR publishes the release; the tag is created here,
    #                     after the gates pass, rather than by a human beforehand.
    #   tags: ['v*']      the ESCAPE HATCH. Pushing a tag by hand still works,
    #                     for re-running a release whose publish step failed or
    #                     for tagging a commit that is already on main.
    #
    # Both converge on the `resolve` job below, which is the only place that
    # decides what is being released.
    branches:
      - main
    tags:
      - 'v*'

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      # The tag being released, WITH the leading v (e.g. v0.2.2). Every job that
      # names an image or the release uses this rather than github.ref_name,
      # because on the branch-push path there is no tag ref to read.
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      # false = this push to main was not a release (no version bump), so every
      # downstream job skips. Ordinary fixes can land on main freely.
      go: ${{ steps.r.outputs.go }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what is being released
        id: r
        run: |
          VERSION=$(grep -oE "VERSION = '[^']+'" src/Core/CoreVersion.php | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "CoreVersion::VERSION = ${VERSION}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Hand-pushed tag: it is authoritative, but it must agree with the
            # constant or the release would ship a version that lies.
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG}" != "v${VERSION}" ]; then
              echo "::error::Tag ${TAG} does not match CoreVersion::VERSION (${VERSION}). Bump src/Core/CoreVersion.php first, then tag."
              exit 1
            fi
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            # Push to main. Release only if this version has never been tagged;
            # otherwise this is an ordinary commit and must not re-publish.
            TAG="v${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::notice::${TAG} already exists — this push to main is not a release. Skipping."
              echo "go=false" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::main is at ${VERSION} with no ${TAG} tag — releasing."
              echo "go=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify tag + full suite
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.go == 'true'

    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-release-verify-${{ hashFiles('composer.lock') }}
          restore-keys: composer-release-verify-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: The release must match CoreVersion::VERSION
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          # `resolve` read the constant with grep; this reads it through the
          # autoloader. Two independent mechanisms agreeing is the point - the
          # failure guarded here is a release that ships a version different
          # from the one it claims, and grep alone could be fooled by a comment
          # or a second constant.
          #
          # Compared against RELEASE_TAG, not the git ref: on the normal path
          # this workflow is triggered by a push to main, where the ref name is
          # "main" and there is no tag to read yet.
          VERSION=$(php -r "require 'vendor/autoload.php'; echo \Whity\Core\CoreVersion::VERSION;")
          if [ "${RELEASE_TAG}" != "v${VERSION}" ]; then
            echo "::error::Releasing ${RELEASE_TAG} but CoreVersion::VERSION is ${VERSION}. Bump src/Core/CoreVersion.php first."
            exit 1
          fi
          echo "Releasing version ${VERSION}"

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src tests plugins sdk

      - name: Plugin-load smoke
        run: php scripts/ci-plugin-smoke.php

      # A release must not ship an in-tree plugin whose screens silently do not
      # register (#969) — loading successfully is not the same as contributing
      # the UI the plugin declares.
      - name: Plugin frontend-feature registration guard
        run: php scripts/ci-plugin-frontend-features.php

      # A core release ships templates/tauri-desktop/ as the source an operator
      # builds their desktop app from, so a release cutting with a stale
      # vendored SDK hands every device a plugin contract older than the one
      # this same tag publishes to plugin authors (#849).
      - name: Vendored-SDK parity (desktop template)
        run: php scripts/ci-vendored-sdk-parity.php

  postgres-integration:
    name: Migrations + seed on real PostgreSQL
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.go == 'true'

    permissions:
      contents: read

    # A real PostgreSQL service so migrations/seed run against the actual engine.
    # This catches Postgres-specific bugs the SQLite test suite cannot — e.g. use
    # of a reserved keyword as an identifier (WC-65: `symmetric`), which only
    # fails on PostgreSQL.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: whity
          POSTGRES_PASSWORD: whity_dev
          POSTGRES_DB: whity_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whity -d whity_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-release-postgres-${{ hashFiles('composer.lock') }}
          restore-keys: composer-release-postgres-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # The app reads configuration from $_ENV (not getenv); the CLI bootstrap
      # loads a .env file into $_ENV, so write one rather than rely on the runner's
      # variables_order including 'E'.
      - name: Write .env for the CLI bootstrap
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=whity_core
          DB_USER=whity
          DB_PASSWORD=whity_dev
          JWT_SECRET=ci_jwt_secret_min_32_chars_for_hs256_aaaa
          ENCRYPTION_KEY=ci_encryption_key_min_32_chars_bbbbbbbb
          INITIAL_ADMIN_PASSWORD=admin123
          INITIAL_USER_PASSWORD=user123
          INITIAL_SYSTEM_ADMIN_PASSWORD=systemadmin123
          INITIAL_SUPERUSER_PASSWORD=superuser123
          EOF

      - name: Run migrations on real PostgreSQL
        run: php public/index.php migrate run

      - name: Seed on real PostgreSQL
        run: php public/index.php seed

      - name: Re-run migrations (idempotency on PostgreSQL)
        run: php public/index.php migrate run

      # A release must not ship a route gated on a permission nobody holds (#990).
      # On upgrade that is a capability an operator HAD and silently loses, on a
      # deployment nobody is watching — the sovereign long-lived installs this
      # platform sells into apply migrations incrementally, so the tag is the last
      # point at which the grant and the gate can still be shipped together.
      - name: Permission-holder guard
        run: php scripts/ci-permission-holder-guard.php

  web:
    name: Frontend types, tests & generated-artifact drift
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.go == 'true'

    permissions:
      contents: read

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          # Single lockfile at the workspace root (npm workspaces).
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      # The committed lib/api/schema.d.ts must match a fresh generation from
      # public/openapi.json — API changes that skip `npm run generate:api`
      # would ship a typed client that lies about the contract (WC-168).
      - name: Typed-client schema drift check
        run: |
          npm run generate:api
          git diff --exit-code -- lib/api/schema.d.ts

      # The committed design-token outputs must match the generator (base.json
      # is the single source of truth for styling variables).
      - name: Design-token drift check
        run: npm run tokens:check

      # The shadcn registry manifest must stay buildable; its output is
      # generated at build time (prebuild) and never committed.
      - name: Registry build smoke
        run: npm run registry:build

      - name: Type check
        run: npx tsc --noEmit

      # ESLint gate (WC-122): zero errors required; warnings are tolerated.
      - name: Lint
        run: npm run lint

      # A full production build gates build-breaking RSC/route errors and a
      # broken prebuild shadcn-registry generation (WC-180); kept in parity with
      # the PR gate (automated-tests.yml) so a release is never gated weaker than
      # a PR. `npm run build` runs the `prebuild` registry hook then `next build`.
      # On Next 16 `next build` no longer runs ESLint — lint is its own gate.
      - name: Build (production)
        run: npm run build

      - name: Run Jest
        run: npx jest

  image:
    name: Build + push ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: [resolve, verify, postgres-integration, web]
    if: needs.resolve.outputs.go == 'true'

    permissions:
      contents: read
      packages: write
      security-events: write   # WC-d: upload the Trivy image-scan SARIF

    # EVERY tier of the product is published here, by ONE matrixed job, so they
    # can never drift apart: identical gates, identical tags, identical scan.
    # A release that shipped only the PHP image left deployments assembled from
    # published artifacts with an API and no user interface (WHIT-588) — the
    # frontend was validated by the `web` job above and then thrown away.
    #
    #   app    — PHP/FrankenPHP backend, root Dockerfile, `release` stage.
    #   web    — Next.js frontend, web/Dockerfile, `runtime` stage.
    #   render — document/label PDF render tier (ADR 0012),
    #            render-service/Dockerfile, `runtime` stage.
    #
    # `app` keeps the unsuffixed repository path it has always published under,
    # because existing deployments already pin `ghcr.io/<repo>:vX.Y.Z`; the
    # frontend takes the `/web` sub-path beside it, and the render tier `/render`
    # beside that.
    #
    # The render tier belongs HERE specifically, and not in an operator's own
    # build, because of its build context (#947). render-service/Dockerfile takes
    # the REPOSITORY ROOT: it bundles web/components/documents, web/lib/documents
    # and packages/{ui,features}/src in from source so an exported PDF comes out
    # of the same renderer the designer draws with (ADR 0012's entire premise).
    # But render-service/ ships in the app image and that web source ships only
    # in the web image, so NEITHER published artifact can build it. Until this
    # leg existed, running the render tier meant hand-assembling a context from
    # both images and redoing it on every core bump — and a miss there does not
    # fail, it silently exports PDFs that no longer match the preview, which is
    # the precise failure ADR 0012 exists to prevent. The tag is the pairing:
    # `render:vX.Y.Z` is built from the same commit as `app:vX.Y.Z`, and the
    # image reports the version it was built from on /health (asserted in
    # `smoke`) so a mismatched pair is visible from outside the box.
    #
    # Note the render leg needs no context change: `context: .` below is already
    # the repository root, which is exactly what that Dockerfile requires.
    # `render-service/Dockerfile.dockerignore` narrows what is SENT, not what is
    # reachable, and it re-includes those source trees verbatim — so the bundled
    # sources are the same files the `web` job type-checked and built above.
    strategy:
      # Do not cancel the siblings when one leg fails: a broken release wants
      # every build log in the same run. Any leg failing still fails every
      # job that `needs: [image]`, so this weakens no gate.
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: Dockerfile
            target: release
            suffix: ''
          - image: web
            dockerfile: web/Dockerfile
            target: runtime
            suffix: /web
          - image: render
            dockerfile: render-service/Dockerfile
            target: runtime
            suffix: /render

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase repository path; github.repository may not be.
      - name: Resolve image name
        id: image
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          # The build context is a COPIED tree with no .git, so next.config.ts
          # cannot resolve the commit itself and every /web-build field comes
          # back null — which is how v0.2.2 shipped an endpoint that answered
          # but could not identify the bundle it served. Harmless to the app
          # image, which ignores it; the render image consumes it for the same
          # reason the web image does, and reports it on /health.
          build-args: |
            WHITY_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.resolve.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest

      # WC-d: scan the just-pushed release image for OS/library CVEs. REPORT-ONLY
      # for now (exit-code 0): a base-image HIGH/CRITICAL must not block the first
      # release. ignore-unfixed drops CVEs with no available fix (pure noise for a
      # gate). Findings land in the Security tab via the SARIF upload below; flip
      # exit-code to '1' to make it a hard release gate once the image is triaged.
      - name: Trivy image vulnerability scan (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ needs.resolve.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # One category per image: code scanning REPLACES the previous results for a
      # category, so a shared one would leave whichever leg finished last as the
      # only findings in the Security tab.
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.image }}

  smoke:
    # WC-2990117b: Boot the GHCR images that were just pushed and confirm they
    # serve a real HTTP 200 before the GitHub Release is created. This closes the
    # gap where a broken image (bad migration, missing extension, wrong
    # Caddyfile, boot crash) would become a published Release and be picked up by
    # every sovereign deployment running `update:check`.
    #
    # WHIT-588: the frontend is gated the same way, and for the same reason. A
    # release whose UI does not boot is as broken as one whose API does not, and
    # a green /api/health is exactly what hid the missing frontend last time —
    # so the UI is proven by fetching a real page (/login) off the published web
    # image, wired to the app container the way a deployment wires it.
    #
    # #947: the render tier gets the strongest check of the three, because
    # "starts up" says the least about it. Its failure mode is not a crash — it
    # is a container that answers /health perfectly while producing a blank or
    # unshaped page, because the harness bundle did not build, Chromium is
    # missing, or the Arabic fonts are not in the image. So it is proven by
    # POSTing a real template and asserting the PDF that comes back: correct
    # magic bytes, several distinct embedded font subsets (text was actually
    # shaped, not left blank), and a plausible size. A render image that builds
    # but cannot render is worse than no render image at all — it would pass a
    # liveness probe in every deployment that pulled it.
    #
    # Networking approach: GitHub Actions `services:` containers live on a
    # separate Docker-managed bridge that job-level `docker run` containers
    # CANNOT reach by container name — only the runner host can. To mirror a
    # real docker-compose deploy (app → postgres, web → app, all by DNS name) we
    # create a user-defined bridge network and run every container on it.
    name: Smoke-test the release images
    runs-on: ubuntu-latest
    needs: [resolve, image]
    if: needs.resolve.outputs.go == 'true'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the image names the same way the `image` job does: lowercase the
      # repository path because GHCR requires it and github.repository may not be.
      - name: Resolve image names
        id: image
        run: |
          {
            echo "name=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "web=ghcr.io/${GITHUB_REPOSITORY,,}/web"
            echo "render=ghcr.io/${GITHUB_REPOSITORY,,}/render"
          } >> "$GITHUB_OUTPUT"

      # Isolated bridge so the app reaches Postgres by the container name
      # `postgres` — same topology as docker-compose.yml (DB_HOST: postgres).
      - name: Create docker network
        run: docker network create whity-smoke

      # Run Postgres on the shared bridge. We do NOT use `services:` here
      # because services containers cannot be placed on a user-defined network
      # (they always join the default bridge that `docker run` containers
      # cannot resolve by name). Plain `docker run` + `pg_isready` polling
      # gives us the same health gate without the topology limitation.
      - name: Start Postgres
        run: |
          docker run -d \
            --name postgres \
            --network whity-smoke \
            -e POSTGRES_USER=whity \
            -e POSTGRES_PASSWORD=whity_smoke \
            -e POSTGRES_DB=whity_core \
            postgres:15-alpine

      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U whity -d whity_core && break
            echo "Waiting for Postgres ($i/30)..."
            sleep 2
          done
          docker exec postgres pg_isready -U whity -d whity_core

      - name: Pull release images
        run: |
          docker pull "${{ steps.image.outputs.name }}:${{ needs.resolve.outputs.tag }}"
          docker pull "${{ steps.image.outputs.web }}:${{ needs.resolve.outputs.tag }}"
          docker pull "${{ steps.image.outputs.render }}:${{ needs.resolve.outputs.tag }}"

      # Run migrations and seed inside the release image on the same network so
      # the app can reach Postgres by the container name `postgres`. APP_ENV is
      # set to `development` so the seed command actually inserts the initial
      # accounts (the seed command is a no-op outside development). JWT_SECRET
      # and ENCRYPTION_KEY must be >= 32 chars to pass the JwtSecretGuard /
      # TotpService fast-fail checks that fire even for CLI invocations.
      - name: Run migrations
        run: |
          docker run --rm \
            --network whity-smoke \
            -e APP_ENV=development \
            -e DB_HOST=postgres \
            -e DB_PORT=5432 \
            -e DB_NAME=whity_core \
            -e DB_USER=whity \
            -e DB_PASSWORD=whity_smoke \
            -e JWT_SECRET=ci_smoke_jwt_secret_min_32_chars_aaaa \
            -e ENCRYPTION_KEY=ci_smoke_encryption_key_min_32_chars_bb \
            -e INITIAL_ADMIN_PASSWORD=smoke_admin_password_123 \
            -e INITIAL_USER_PASSWORD=smoke_user_password_1234 \
            -e INITIAL_SYSTEM_ADMIN_PASSWORD=smoke_sysadmin_password_12 \
            -e INITIAL_SUPERUSER_PASSWORD=smoke_superuser_password_12 \
            "${{ steps.image.outputs.name }}:${{ needs.resolve.outputs.tag }}" \
            php public/index.php migrate run

      - name: Run seed
        run: |
          docker run --rm \
            --network whity-smoke \
            -e APP_ENV=development \
            -e DB_HOST=postgres \
            -e DB_PORT=5432 \
            -e DB_NAME=whity_core \
            -e DB_USER=whity \
            -e DB_PASSWORD=whity_smoke \
            -e JWT_SECRET=ci_smoke_jwt_secret_min_32_chars_aaaa \
            -e ENCRYPTION_KEY=ci_smoke_encryption_key_min_32_chars_bb \
            -e INITIAL_ADMIN_PASSWORD=smoke_admin_password_123 \
            -e INITIAL_USER_PASSWORD=smoke_user_password_1234 \
            -e INITIAL_SYSTEM_ADMIN_PASSWORD=smoke_sysadmin_password_12 \
            -e INITIAL_SUPERUSER_PASSWORD=smoke_superuser_password_12 \
            "${{ steps.image.outputs.name }}:${{ needs.resolve.outputs.tag }}" \
            php public/index.php seed

      # Start the app detached. Caddy needs auto_https off and an explicit
      # SERVER_NAME so it binds to :80 rather than trying ACME. These are the
      # same vars docker-compose.yml passes to the frankenphp service.
      #
      # FRANKENPHP_CONFIG: the GHCR release image uses the base FrankenPHP
      # image's /etc/frankenphp/Caddyfile (not the project's Caddyfile, which
      # is bind-mounted in docker-compose but not in a plain `docker run`). The
      # base Caddyfile injects {$FRANKENPHP_CONFIG} into the frankenphp block,
      # so setting this env var enables persistent worker mode — matching the
      # production topology — without needing to mount the project Caddyfile.
      - name: Start app container
        run: |
          docker run -d \
            --name whity-app \
            --network whity-smoke \
            -p 8000:80 \
            -e APP_ENV=production \
            -e DB_HOST=postgres \
            -e DB_PORT=5432 \
            -e DB_NAME=whity_core \
            -e DB_USER=whity \
            -e DB_PASSWORD=whity_smoke \
            -e JWT_SECRET=ci_smoke_jwt_secret_min_32_chars_aaaa \
            -e ENCRYPTION_KEY=ci_smoke_encryption_key_min_32_chars_bb \
            -e CADDY_GLOBAL_OPTIONS="auto_https off" \
            -e SERVER_NAME=":80" \
            -e SERVER_ROOT="public/" \
            -e FRANKENPHP_CONFIG="worker /app/public/index.php 4" \
            "${{ steps.image.outputs.name }}:${{ needs.resolve.outputs.tag }}"

      # Poll GET /api/health until HTTP 200. A fresh FrankenPHP worker pool
      # (8 workers by default) takes a couple of seconds to boot, so we allow
      # up to 60 seconds (30 × 2 s). On timeout we dump the container logs and
      # the process list so the failure is diagnosable from the Actions run.
      - name: Wait for health 200
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health || true)
            echo "Attempt $i/30 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              curl -s http://localhost:8000/api/health
              exit 0
            fi
            sleep 2
          done
          echo "::error::Health check did not return 200 within 60 seconds."
          docker logs whity-app
          docker ps -a
          exit 1

      # Start the frontend on the same bridge, pointed at the app container by
      # its DNS name — the topology docker-compose.staging-remote.yml deploys.
      # WHITY_BACKEND_URL is read from the process environment per request
      # (web/lib/backend-url.ts), so this is pure runtime config: the same
      # published image takes a different origin in every deployment.
      - name: Start web container
        run: |
          docker run -d \
            --name whity-web \
            --network whity-smoke \
            -p 3000:3000 \
            -e WHITY_BACKEND_URL=http://whity-app \
            "${{ steps.image.outputs.web }}:${{ needs.resolve.outputs.tag }}"

      # Poll GET /login until HTTP 200 — a real rendered page, not a liveness
      # ping, so a frontend that boots but cannot render fails the release.
      - name: Wait for the UI to serve /login
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login || true)
            echo "Attempt $i/30 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "UI check passed."
              exit 0
            fi
            sleep 2
          done
          echo "::error::GET /login did not return 200 within 60 seconds."
          docker logs whity-web
          docker ps -a
          exit 1

      # The bundle must be able to IDENTIFY itself, not merely render.
      #
      # v0.2.2 shipped /web-build answering 200 with every identifying field
      # null, because the image build supplied neither the commit nor
      # CoreVersion.php. The endpoint existed and was useless: comparing the
      # served bundle's core_version against /api/health — the entire reason it
      # was added — stayed exactly as impossible as before.
      #
      # A 200 was never the property worth checking. This asserts the CONTENT,
      # so an image that cannot say what it is fails the release.
      - name: The served bundle must identify itself
        run: |
          BODY=$(curl -s --max-time 10 http://localhost:3000/web-build)
          echo "$BODY"

          MISSING=$(python3 - "$BODY" <<'PY'
          import json, sys
          try:
              d = json.loads(sys.argv[1])
          except Exception as e:
              print(f"unparseable: {e}")
              sys.exit(0)
          bad = [k for k in ("build_id", "commit", "core_version") if not d.get(k)]
          print(",".join(bad))
          PY
          )

          if [ -n "$MISSING" ]; then
            echo "::error::/web-build cannot identify the bundle — empty: ${MISSING}. Build identity was not injected into the image."
            exit 1
          fi
          echo "Bundle identity check passed."

      # On the same bridge and under the container name `render`, because that
      # is the hostname RENDER_SERVICE_URL defaults to in every compose file —
      # the image is started the way a deployment starts it, not in a shape
      # invented for the test. The checks below then call it directly on the
      # published port rather than through the app: driving core's render
      # endpoint would need a seeded template, a session and the
      # documents.render_enabled flag, none of which say anything more about
      # whether THIS IMAGE can render.
      #
      # The shared secret is compared in constant time and must be >= 32 chars
      # or the service refuses every render. The value is throwaway; it never
      # leaves this runner.
      - name: Start render container
        run: |
          docker run -d \
            --name render \
            --network whity-smoke \
            -p 8130:8130 \
            -e RENDER_SHARED_SECRET=ci_smoke_render_shared_secret_32ch \
            "${{ steps.image.outputs.render }}:${{ needs.resolve.outputs.tag }}"

      - name: Wait for the render tier to answer /health
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8130/health || true)
            echo "Attempt $i/30 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Render health check passed."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The render image did not answer /health within 60 seconds."
          docker logs render
          docker ps -a
          exit 1

      # The pairing has to be CHECKABLE, not just asserted by the tag.
      #
      # Nothing stops an operator from running render:v0.2.9 against app:v0.2.7,
      # and nothing about that combination looks wrong: both containers are
      # healthy, exports still succeed, and the PDFs merely stop matching what
      # the designer shows. So the image reports the CoreVersion::VERSION it was
      # built from (render-service/scripts/write-build-info.js) — the same
      # property /web-build gives the UI tier — and this asserts it equals the
      # version being released. An image that cannot say what it is fails here.
      - name: The render image must report the version it was built from
        env:
          EXPECTED: ${{ needs.resolve.outputs.version }}
        run: |
          BODY=$(curl -s --max-time 10 http://localhost:8130/health)
          echo "$BODY"

          REPORTED=$(python3 - "$BODY" <<'PY'
          import json, sys
          try:
              print(json.loads(sys.argv[1]).get("core_version") or "")
          except Exception:
              print("")
          PY
          )

          if [ "$REPORTED" != "$EXPECTED" ]; then
            echo "::error::The render image reports core_version '${REPORTED}' but this release is ${EXPECTED}. The render tier would not pair with its own app image."
            exit 1
          fi
          echo "Render tier identifies as ${REPORTED}."

      # The actual proof: a real Puppeteer round-trip through the PUBLISHED
      # image. Deliberately the same payload shape the PR gate uses
      # (automated-tests.yml, `render-service` job) so the release is never
      # gated weaker than a PR — text + KaTeX math + a bwip-js barcode +
      # Arabic, the four things whose absence from the image is silent.
      #
      # Structural assertions only; exact golden-image pixel diffing is too
      # fragile across environments. Several DISTINCT embedded font subsets is
      # the signal that carries the most: a blank page embeds none, and a page
      # whose fonts are missing from the image embeds one fallback.
      - name: The render image must actually render a PDF
        run: |
          cat > "${RUNNER_TEMP}/render-payload.json" <<'PAYLOAD'
          {
            "template": {
              "version": 2,
              "page": { "widthMm": 100, "heightMm": 60, "marginMm": 2, "background": "#ffffff" },
              "placeholders": [],
              "pages": [
                {
                  "id": "p1",
                  "elements": [
                    { "id": "t1", "type": "text", "x": 2, "y": 2, "w": 96, "h": 12, "rotation": 0, "z": 1,
                      "text": "مرحبا بالعالم",
                      "style": { "fontSize": 18, "fontWeight": "normal", "fontStyle": "normal", "align": "center", "vAlign": "middle", "color": "#000000", "direction": "rtl" } },
                    { "id": "m1", "type": "math", "x": 2, "y": 16, "w": 60, "h": 14, "rotation": 0, "z": 2,
                      "expression": "E = mc^2", "block": false },
                    { "id": "b1", "type": "barcode", "x": 2, "y": 32, "w": 60, "h": 20, "rotation": 0, "z": 3,
                      "symbology": "code128", "value": "WHITY-RELEASE-SMOKE", "showText": true }
                  ]
                }
              ]
            },
            "dataRows": [{}]
          }
          PAYLOAD

          curl -fsS --max-time 120 -X POST http://localhost:8130/render \
            -H 'Content-Type: application/json' \
            -H 'X-Render-Secret: ci_smoke_render_shared_secret_32ch' \
            --data @"${RUNNER_TEMP}/render-payload.json" \
            -o "${RUNNER_TEMP}/render-output.pdf" || {
              echo "::error::POST /render failed against the published render image."
              docker logs render
              exit 1
            }

          test -s "${RUNNER_TEMP}/render-output.pdf"
          head -c 5 "${RUNNER_TEMP}/render-output.pdf" | grep -q '%PDF-'

          font_count=$(grep -a -c 'BaseFont' "${RUNNER_TEMP}/render-output.pdf" || true)
          echo "embedded BaseFont occurrences: ${font_count}"
          if [ "${font_count}" -lt 2 ]; then
            echo "::error::The rendered PDF embeds ${font_count} font subset(s) — the page rendered blank or unshaped."
            docker logs render
            exit 1
          fi

          size=$(stat -c%s "${RUNNER_TEMP}/render-output.pdf")
          echo "PDF size: ${size} bytes"
          if [ "${size}" -le 5000 ]; then
            echo "::error::The rendered PDF is ${size} bytes — too small to contain the smoke template's content."
            docker logs render
            exit 1
          fi
          echo "Render round-trip passed."

      # Always clean up the containers and network, even on failure, so the
      # runner is left in a clean state for any subsequent jobs.
      - name: Tear down
        if: always()
        run: |
          docker rm -f render whity-web whity-app postgres 2>/dev/null || true
          docker network rm whity-smoke 2>/dev/null || true

  release:
    name: Tag and create the GitHub Release
    runs-on: ubuntu-latest
    # smoke is now a gate: a release image that does not boot and serve /api/health
    # can never become a published GitHub Release (and thus never be picked up by
    # sovereign deployments running `update:check`).
    needs: [resolve, verify, postgres-integration, web, image, smoke]
    if: needs.resolve.outputs.go == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout the commit being released
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the release
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          # Deliberately LAST - after the suite, both image builds, and the
          # smoke test against the PUBLISHED images.
          #
          # A tag created up front and then orphaned by a failed build is the
          # worst outcome available here: releases are immutable, so the tag
          # cannot be moved, and the next attempt would need a brand-new
          # version number for a failure that had nothing to do with the code.
          # Creating it here means a failed run is simply re-runnable.
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::notice::${RELEASE_TAG} already exists (hand-pushed tag path) - not recreating."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${RELEASE_TAG}" -m "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag

  back-merge:
    name: Open the back-merge PR
    runs-on: ubuntu-latest
    # Only once the release actually published. A back-merge for a release
    # that failed to ship would carry a version bump onto develop describing
    # a release nobody can install.
    needs: [resolve, release]
    if: needs.resolve.outputs.go == 'true'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open develop <- main if they have diverged
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          git fetch --quiet origin develop main

          # The release merge commit lives only on main, so develop reads as
          # "behind" the moment a release ships even though the trees are
          # identical. Left alone across several releases, main accumulates
          # merge commits develop has never seen and "is main ahead?" stops
          # being answerable at a glance. Closing that loop here is what makes
          # it a step nobody has to remember.
          BEHIND=$(git rev-list --count origin/develop..origin/main)
          if [ "$BEHIND" = "0" ]; then
            echo "::notice::develop already contains main. Nothing to back-merge."
            exit 0
          fi

          EXISTING=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "::notice::PR #${EXISTING} already back-merges main into develop."
            exit 0
          fi

          # The body goes through a FILE, not an inline --body string. Two bugs lived
          # in the inline version and only one of them was visible:
          #
          #  - it used a literal \n where a line continuation was meant, so `gh` got
          #    four bare `n` arguments and refused. This step therefore failed on EVERY
          #    release since it was added, which is why main's ancestry had to be
          #    repaired by hand rather than by the job that exists to prevent that;
          #  - a multi-line string inside this block scalar carries the step's own
          #    indentation into the body, and Markdown reads indented lines as a code
          #    block. The whole explanation would have rendered as monospace even after
          #    the quoting was fixed -- so fixing only the visible bug would have looked
          #    done without being done.
          #
          # Heredoc body lines sit at this step's indentation on purpose: YAML strips it,
          # so the shell (and the rendered Markdown) see column 0.
          cat > "${RUNNER_TEMP}/back-merge-body.md" <<EOF
          Opened automatically after **${RELEASE_TAG}** published.

          Expect **zero file changes**. This carries main's release merge commit back onto develop so git stops reporting develop as behind.

          ## Merge this NOW, or close it

          Strict branch protection requires the HEAD branch to be up to date with the BASE. Here the head is main and the base is develop, so this is mergeable ONLY while nothing new has landed on develop. Once something has, this PR can never merge — and update-branch would push unreleased work from develop onto the release line, the opposite of the intent.

          ## If that window closed, closing this is correct

          The merge commit it carries has a tree IDENTICAL to its develop-side parent, which develop already contains. main introduces no content develop lacks, so every future develop-to-main merge is still clean. What you lose by closing is cosmetic: git reports develop as N behind after N releases, which misleads a reader but breaks nothing.
          EOF

          gh pr create \
            --base develop \
            --head main \
            --title "chore: back-merge main into develop after ${RELEASE_TAG}" \
            --body-file "${RUNNER_TEMP}/back-merge-body.md"
