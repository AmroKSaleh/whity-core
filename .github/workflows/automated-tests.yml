name: Automated Tests

# Doc-only changes can't affect the build, tests, or generated artifacts, so the
# expensive jobs below still skip on them — but they skip via the `changes` job,
# NOT via `paths-ignore` on the trigger.
#
# That difference is the whole point. `paths-ignore` stops the workflow from
# starting at all, so `CI gate` never reports — and `CI gate` is a REQUIRED check
# on both `develop` and `main`. A required check that never reports is not a
# skipped check, it is a permanently pending one, so every doc-only PR was
# unmergeable by construction.
#
# This block used to end with the note "No required status checks are configured
# on `main`, so a skipped run never leaves a doc-only PR blocked on a pending
# check." That was true when it was written, and stopped being true the day
# branch protection was added — with nothing linking the two changes, and no
# failure until someone opened a PR that touched only docs.
#
# Filtering inside the workflow cannot rot that way: the gate always reports, and
# it already treats `skipped` as success, so the saving is kept and the deadlock
# is not reachable.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# A newer push to the same ref obsoletes the in-flight run; never let two full
# suites race (this is what burned a duplicate ~13-min run when a fix commit
# landed on a PR before the prior run finished). Mirrors e2e.yml.
#
# The group is workflow-wide, so it keeps covering every job below — including
# the shard matrices and the `coverage` fan-in — as one cancellable unit.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Job graph (WC-ci-wallclock)
#
#   changes ──┬─ test (SQLite shard 1..4, coverage) ─── coverage (merge + floor)
#             ├─ static-analysis
#             ├─ postgres-migrations
#             ├─ postgres-integration (shard 1..5)
#             ├─ postgres-dialect (shard 1..2)
#             ├─ i18n-catalogue
#             ├─ web
#             └─ render-service
#
# Everything here used to live in two serial jobs. Measured on run 31404403319
# (2026-08-10) the two of them pinned the whole workflow at ~32 min, and inside
# them ONE step dominated each: the PostgreSQL job spent 30m18s of its 31m30s in
# `--testsuite Integration`, and the SQLite job spent 16m46s of its 17m09s in the
# coverage-instrumented PHPUnit run. Peeling the *other* steps off those two jobs
# is therefore worth ~45 s combined — real, but noise. The wall clock only moves
# when the two long test runs themselves are split across runners, which is what
# the two shard matrices below do. Nothing is skipped or narrowed: every test,
# guard and check that ran before still runs, on the same triggers.
# ---------------------------------------------------------------------------

jobs:
  # Detect which side of the codebase changed so single-sided PRs skip the jobs
  # they can't affect: a backend-only PR skips the ~2-min `web` job, and a
  # frontend-only PR skips the real-Postgres jobs. The typed-client drift gate
  # lives in `web` and depends only on public/openapi.json (the generated
  # contract), so `web` runs whenever that file changes — a src/** change that
  # alters the API necessarily regenerates it (the `static-analysis` job's
  # OpenAPI drift check enforces that), so the drift gate is never skipped.
  # Workflow-file edits run everything. If detection can't run (e.g. a push with
  # no fetchable base), the filter fails open and the jobs run.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      render_service: ${{ steps.filter.outputs.render_service }}
      i18n: ${{ steps.filter.outputs.i18n }}
      date_display: ${{ steps.filter.outputs.date_display }}
      desktop_host: ${{ steps.filter.outputs.desktop_host }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'plugins/**'
              - 'sdk/**'
              - 'database/**'
              - 'public/**'
              - 'scripts/**'
              - 'composer.json'
              - 'composer.lock'
              - 'phpstan.neon'
              - 'phpstan-baseline.neon'
              - 'phpunit.xml'
              - 'infection.json5'
              - '.github/workflows/automated-tests.yml'
            # The Tauri desktop template ships its own vendored copy of the
            # plugin SDK, and the parity guard that compares it against sdk/src
            # lives in `static-analysis`. Its own filter, because the OTHER
            # half of what that guard reads is not under any path `backend`
            # matches: an edit that touches only the device's copy is exactly
            # the drift being guarded against, and under `backend` alone it
            # would skip the entire job and merge unchecked. Scoped to
            # php-host/ rather than the whole template — the Rust and TS sides
            # cannot move this guard, and pulling them in would run PHP static
            # analysis for every icon change.
            desktop_host:
              - 'templates/tauri-desktop/php-host/**'
              - '.github/workflows/automated-tests.yml'
            frontend:
              - 'web/**'
              # packages/** are consumed by web/ as RAW SOURCES (@amroksaleh/ui
              # exports "." -> "./src/index.ts"), so a change there compiles
              # inside every consumer's build — yet a packages-only PR used to
              # skip this job entirely and ship unverified.
              - 'packages/**'
              # #1050. `web/jest.config.mjs` roots ALREADY reach into this tree
              # (added with #932), so its nine suites — 90 tests, all green —
              # run under the `web` job below. But nothing in this filter
              # matched the tree they live in, so a PR touching ONLY the
              # desktop template skipped that job entirely and ran none of
              # them. The tests were not missing; the trigger was, which is the
              # worse of the two failures: the suite looks covered, and the
              # commits least likely to be exercised elsewhere are exactly the
              # ones that ran nothing.
              #
              # Listed file-by-file rather than as `templates/tauri-desktop/**`
              # so php-host/ (which has its own `desktop_host` filter for the
              # PHP parity guard) and src-tauri/ (Rust, built only on a release
              # tag) do not drag a full Next build and two Storybook galleries
              # along with them.
              - 'templates/tauri-desktop/src/**'
              - 'templates/tauri-desktop/index.html'
              - 'templates/tauri-desktop/package.json'
              - 'templates/tauri-desktop/tsconfig.json'
              - 'templates/tauri-desktop/tsconfig.node.json'
              - 'templates/tauri-desktop/vite.config.ts'
              - 'public/openapi.json'
              - '.github/workflows/automated-tests.yml'
            # ADR 0012: the render service bundles this exact source slice
            # in from the rest of the monorepo (see
            # render-service/scripts/build-harness.js) — a change there can
            # break the harness bundle even without touching render-service/
            # itself.
            render_service:
              - 'render-service/**'
              - 'web/components/documents/**'
              - 'web/lib/documents/**'
              - 'packages/ui/src/documents/**'
              - 'packages/ui/src/math-text.tsx'
              - '.github/workflows/automated-tests.yml'
            # The English catalogue is derived from the t() calls in the
            # frontend, but the guard that checks it is PHP. It therefore
            # deliberately does NOT ride on either existing filter: `backend`
            # would skip it on the frontend-only PRs that produce almost all of
            # the drift, and `frontend` runs a Node job with no PHP. Its own
            # filter is the only way it fires on every change that can move the
            # catalogue.
            i18n:
              - 'web/**'
              - 'packages/**'
              - 'database/i18n/**'
              - 'src/Core/i18n/**'
              - 'src/Cli/Commands/I18nCommand.php'
              - 'scripts/ci-i18n-catalog-drift.php'
              - '.github/workflows/automated-tests.yml'
            # #1068. Same shape as `i18n` directly above and for the same
            # reason: the input is the FRONTEND and the guard is PHP, so
            # `backend` would skip it on exactly the frontend-only PRs that can
            # introduce a leak, and `frontend` runs a Node job with no PHP.
            #
            # `ui.hide_dates` promises a tenant that no date appears anywhere in
            # the interface, and that promise is falsifiable by a single screen.
            # A guard that skips on the PR adding that screen is not a guard.
            date_display:
              - 'web/**'
              - 'packages/**'
              - 'src/Core/Ui/**'
              - 'scripts/ci-date-display-guard.php'
              - '.github/workflows/automated-tests.yml'

  # The whole PHPUnit suite (the `default` testsuite = every *Test.php under
  # tests/) on SQLite, with pcov instrumentation — split across runners because
  # a single coverage-instrumented pass measured 16m46s and pinned half the
  # workflow.
  #
  # Sharding is by FILE, round-robin over the same deterministic sorted listing
  # in every shard, so the union of the shards is exactly the file set PHPUnit's
  # own `<directory>tests</directory>` iterator would walk — a newly added test
  # file lands in exactly one shard automatically and can never fall through the
  # gaps (which a hand-maintained per-shard directory list would allow).
  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Keep the `/4` here in step with the matrix below; the shard arithmetic
    # itself reads `strategy.job-total`, so only this label is manual.
    name: Tests shard ${{ matrix.shard }}/4 (SQLite, coverage)
    runs-on: ubuntu-latest

    strategy:
      # One shard's failure must not cancel the others: a red run should report
      # every failing test, not just the first shard to trip.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: pcov

      # Unified composer cache key (WC-232ec317): the vendor/ tree is identical
      # across the test / postgres / mutation / e2e jobs (they differ only in
      # loaded PHP extensions, which live outside vendor/), so one shared key
      # warms them all and cuts redundant cache entries under the 10 GB budget.
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # `--coverage-php` writes php-code-coverage's own serialised object, which
      # the `coverage` job merges with the library's `CodeCoverage::merge()` —
      # the exact union of executed lines, not an approximation reconstructed
      # from per-shard Clover XML. Measured ~0.6 M (line, test) pairs across the
      # whole suite, so a shard's .cov is tens of MB: cheap to hand between jobs.
      - name: Run PHPUnit with coverage (shard ${{ matrix.shard }})
        run: |
          mapfile -t all < <(find tests -type f -name '*Test.php' | LC_ALL=C sort)
          total=${#all[@]}
          if [ "$total" -eq 0 ]; then
            echo "::error::no test files matched tests/**/*Test.php — refusing to run an empty shard"
            exit 1
          fi

          shards=${{ strategy.job-total }}
          index=$(( ${{ matrix.shard }} - 1 ))
          files=()
          for i in "${!all[@]}"; do
            if [ $(( i % shards )) -eq "$index" ]; then
              files+=("${all[$i]}")
            fi
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }}/${shards} selected 0 of ${total} test files"
            exit 1
          fi

          echo "Shard ${{ matrix.shard }}/${shards}: ${#files[@]} of ${total} test files"
          vendor/bin/phpunit \
            --coverage-php "coverage-shards/shard-${{ matrix.shard }}.cov" \
            "${files[@]}"

      # `always()`: PHPUnit writes the coverage report even when tests fail, and
      # a partial report is still useful when diagnosing a red run.
      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shards/shard-${{ matrix.shard }}.cov
          retention-days: 1
          if-no-files-found: ignore

  # The coverage floor is a PROJECT-WIDE aggregate, so it can only be judged
  # once every shard's data is back. This job is the gate that used to be the
  # `Enforce coverage floor` step of the old single `test` job — it is not
  # optional, not PR-skippable, and it fails the run exactly as before.
  coverage:
    name: Coverage merge & floor (SQLite)
    needs: [changes, test]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # This job instruments nothing — it deserialises the shards' coverage
      # objects and renders Clover. pcov is requested anyway because those
      # objects were serialised by a pcov-driven run and carry a driver
      # instance; installing the extension costs seconds and removes any
      # question of unserialising into an environment the object came from.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # php-code-coverage (a phpunit dependency) does the merging and the Clover
      # rendering, so vendor/ is required here.
      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Download shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: coverage-shards

      # Merging holds every shard's (line, test) attribution in memory at once;
      # the suite's ~0.6 M pairs fit comfortably, but don't make the ceiling the
      # thing that fails the build.
      - name: Merge shard coverage into one Clover report
        run: php -d memory_limit=-1 scripts/ci-merge-coverage.php coverage.xml coverage-shards

      # Enforce minimum line-coverage floor defined in scripts/coverage-check.php.
      # The floor value and instructions for updating it live in that file.
      - name: Enforce coverage floor
        run: php scripts/coverage-check.php coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # Static analysis and the codebase-scanning guards need the source tree, not a
  # test run — they were sitting behind ~17 min of PHPUnit purely because they
  # shared a job with it. Split out, PHPStan and the tenant-isolation guards now
  # report inside the first minute of a run.
  static-analysis:
    name: Static analysis, guards & plugin smoke
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.desktop_host == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same extension set as the test shards: the OpenAPI generator and the
      # plugin/guard scripts boot the app's CLI, which expects a PDO driver.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Fail the build on a known security advisory in a locked dependency
      # (WC-232ec317). Cheap (~seconds) and turns a supply-chain regression into
      # a pre-merge gate rather than a production surprise.
      - name: Composer security audit
        run: composer audit --no-interaction --abandoned=report

      # The committed public/openapi.json must match a fresh generation from
      # the live PHP router — API changes that skip `generate:openapi` would
      # ship a published contract that lies to the typed client (#168) and the
      # schema-driven UI (#169). Mirrors the `web` job's schema.d.ts drift
      # check (WC-168); the PHPUnit OpenApiSpecDriftTest is the primary gate,
      # this byte-level diff is defense-in-depth (WC-179).
      - name: OpenAPI spec drift check
        run: |
          php public/index.php generate:openapi
          git diff --exit-code -- public/openapi.json

      # Restore PHPStan's result cache (tmpDir: .phpstan-cache in phpstan.neon)
      # so unchanged files skip re-analysis — turns a ~60s cold analyse into a
      # few seconds on a small diff. Keyed per-commit with a loose restore-key so
      # every run seeds from the most recent cache; PHPStan invalidates internally
      # on any file/config/version change, so a stale restore is always safe.
      - name: Cache PHPStan result cache
        uses: actions/cache@v6
        with:
          path: .phpstan-cache
          key: phpstan-${{ github.sha }}
          restore-keys: phpstan-

      # The paths and the memory limit live in ONE place — the `phpstan` script
      # in composer.json — and this step, scripts/ci-local.sh and any hand-run
      # all go through it (#934). They used to disagree three ways: 1G here,
      # 512M in ci-local.sh, and PHP's 128M default in a plain dev container.
      #
      # 1G, not 512M. PHPStan runs parallel workers and each holds its own
      # analysis state, so the ceiling is per-worker rather than total — 512M
      # was enough until the suite grew past it, at which point a worker
      # crashes and the whole job fails with "Result is incomplete because of
      # severe errors" rather than with a real finding. That reads exactly like
      # a code defect and is not one, which is the expensive part: the failure
      # names a memory limit only if you open the log. At 128M it is worse
      # still — the summary line reads "Found 7 errors", and every one of them
      # is a crashed worker rather than a finding.
      #
      # The runner has ~7GB, so this is not near anything.
      #
      # `ops` is in the path list (see the composer script) because
      # ops/health-watch-healthcheck.php is a container HEALTHCHECK: a probe
      # that fatals is a probe that reports nothing, and nothing was analysing
      # it (WC-766).
      - name: Run PHPStan
        run: composer phpstan

      - name: Plugin-load smoke
        run: php scripts/ci-plugin-smoke.php

      # Plugin frontend-feature registration guard (#969): the smoke step above
      # proves a plugin LOADS, which is not the same as its screens surviving
      # descriptor validation — three in-tree plugins contributed no screens at
      # all while that step stayed green. Fail CI when a declared frontend
      # feature does not register and is not a reviewed, reasoned dormancy.
      - name: Plugin frontend-feature registration guard
        run: php scripts/ci-plugin-frontend-features.php

      # Tenant-isolation static guard (WC-192): fail CI if any SELECT/UPDATE/
      # DELETE touches a tenant-owned table without a tenant_id predicate and
      # without a reasoned `@tenant-guard-ignore:` annotation. Turns the #1
      # product risk (cross-tenant data exposure) into a CI-enforced invariant.
      - name: Tenant-predicate guard
        run: php scripts/ci-tenant-predicate-guard.php

      # Grant-by-role-name guard (#1047): fail when a migration decides who holds
      # a permission by looking a role up as `WHERE name = 'admin'`.
      #
      # STATIC on purpose, and that is the whole point of it. The
      # permission-holder guard in `postgres-migrations` runs against a database
      # that job migrated and SEEDED, whose administrative role IS named `admin`
      # — so every by-name grant lands there and the slug looks held. On a
      # deployment whose administrator is called something else the same
      # migration grants nobody, silently, and the capability surfaces as a
      # screen that answers 200 with no way to navigate to it (#1047). The defect
      # is invisible on any database CI can build, so this reads the migrations
      # instead.
      - name: Grant-by-role-name guard
        run: php scripts/ci-grant-by-role-name-guard.php

      # Emitted-URL version guard (#1046): fail when a URL RETURNED to a client
      # is missing the /v1 the router serves it at.
      #
      # `Router::versionPrefix()` adds the prefix at REGISTRATION, and
      # web/lib/api-client.ts passes /api paths through verbatim — so a declared
      # path is correct written bare and an emitted one is not. Both are
      # '/api/...' literals, which is why the convention (documented in comments
      # at four call sites) was not enough: seven emitters read their neighbours
      # and got it right, one did not, and the document viewer showed an error
      # box on every first click for a release.
      - name: Emitted-URL version guard
        run: php scripts/ci-emitted-url-version-guard.php

      # Plugin tenant-isolation conformance kit (WC-194): run the SDK migration
      # linter + tenant-predicate scanner over the in-tree HelloWorld reference
      # plugin, the way an out-of-repo plugin runs it in its own CI. Fails if a
      # plugin tenant table lacks a tenant_id column or a handler runs an
      # unscoped query on a tenant-owned table.
      - name: Plugin tenant-isolation conformance (HelloWorld)
        run: php scripts/ci-plugin-tenant-conformance.php

      # Undeclared-reference guard: fail CI on a relationship core CANNOT SEE —
      # an `*_id` column pointing at a real table that carries NEITHER a foreign
      # key NOR a `blocks_delete`/`cascade_delete` declaration. With no foreign
      # keys between plugin tables (the convention here) nothing stops a delete
      # orphaning a record's children, and an undeclared edge is precisely the
      # case where core neither refuses the delete nor cleans up after it.
      # It deliberately does NOT flag "an *_id column with no foreign key" —
      # that would fire on the intended design of nearly every plugin table.
      - name: Undeclared-reference guard (in-tree plugins)
        run: php scripts/ci-undeclared-reference-guard.php

      # Database-boolean guard (#891): fail CI on a boolean read whose answer
      # depends on how the driver spelled it. The same BOOLEAN column arrives
      # as bool(false), '0', 'f', or — from a `::text` projection — 'false',
      # and `(bool) 'false'` is TRUE, so the cast reports every row as true
      # instead of failing. #891 found five such casts on memberships.is_primary
      # alone, one of them gating the 409 that refuses to remove a primary
      # membership.
      #
      # It knows which columns are booleans by PARSING THE MIGRATIONS, so it
      # cannot fall behind the schema, and it derives its two common exemptions
      # (request bodies, `SELECT 1`/`COUNT(` existence probes) rather than
      # demanding an annotation for them — see the scanner's header for why a
      # guard that fires on correct code is worse than no guard at all.
      - name: Database-boolean guard
        run: php scripts/ci-db-bool-guard.php

      # Vendored-SDK parity guard (#849): the Tauri desktop template carries its
      # own copy of sdk/src, because a device boots from a hand-rolled PSR-4
      # autoloader with no Composer behind it. Re-vendoring that copy was a
      # manual step verified in a commit message, and it silently fell three SDK
      # releases behind — so the reference plugin, which is also the exact
      # source bin/desktop-plugin-release packages, could not be declared on a
      # device at all. The guard compares the two trees AND boots every in-tree
      # plugin against the device's copy; see the script header for why one
      # check does not subsume the other.
      #
      # Runs whenever `desktop_host` OR `backend` changed — the drift is
      # introduced by an edit to EITHER side, and a guard that watched only the
      # side it happens to live next to would have missed #849 entirely (which
      # was three commits to sdk/**, not one to templates/**).
      - name: Vendored-SDK parity (desktop template)
        run: php scripts/ci-vendored-sdk-parity.php

  # SDK version-collision guard (#873). The parity gate above is HORIZONTAL —
  # source tree versus the desktop template's vendored copy, at one commit. A
  # version collision is VERTICAL, and no horizontal check can see it: #871 and
  # #872 were built in parallel and both set Sdk::VERSION to 1.30.0. Each branch
  # agreed with itself, so both passed parity, and whichever merged second
  # silently overwrote the other's version number with a different meaning —
  # leaving a plugin that declares `^1.30` bound to a contract nobody can
  # identify from the constraint, on devices, offline (#849).
  #
  # Its own job rather than a step in `static-analysis`, for one reason: these
  # guards read GIT HISTORY, so they need fetch-depth: 0. A shallow checkout does
  # not error — it answers with a SMALLER set than the real one, so a number that
  # is already taken reads as free, which is the same silent false green the
  # guards exist to remove. Keeping them in their own job keeps the full fetch off
  # the other jobs, which do not need it.
  #
  # BOTH hand-allocated numbers live here (#971). The migration prefix is the same
  # shape of defect as Sdk::VERSION: two parallel branches each pick 106, neither
  # can see the other, git does not conflict because the filenames differ, and the
  # second PR's CI is honestly green against a base that predates the first. One
  # full fetch serves both checks.
  #
  # No `composer install`: the guards read files and shell out to git.
  history-guards:
    name: Version and migration-number collisions (against develop's history)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.desktop_host == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v7
        with:
          # Load-bearing, not a precaution: at the default depth of 1 this
          # guard's answer is WRONG rather than missing. It refuses to run in a
          # shallow checkout instead of guessing, so removing this line turns
          # the job red rather than green.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      - name: SDK version-collision guard
        run: php scripts/ci-sdk-version-collision.php

      - name: Migration-number collision guard
        run: php scripts/ci-migration-number-collision.php

  # The English translation catalogue must stay a faithful projection of the
  # t() calls that produce it. A converted screen whose keys were never
  # extracted degrades silently and looks successful: the fallback renders, the
  # key never reaches the translations table, and a translator finishes the
  # language with that string still in English.
  #
  # Its own job, and not a step in `static-analysis`, because the input it reads
  # is the FRONTEND and the guard is PHP — see the `i18n` path filter above.
  i18n-catalogue:
    name: i18n catalogue drift
    needs: changes
    if: needs.changes.outputs.i18n == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      # Same key as static-analysis, so this job normally restores rather than
      # resolves — the guard needs the autoloader and nothing else.
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: i18n catalogue drift guard
        run: php scripts/ci-i18n-catalog-drift.php

  # Date-display guard (#1068): fail CI when a date is formatted, or rendered
  # raw, outside `useDateDisplay()`.
  #
  # A tenant may set `ui.hide_dates` and be told that no date or time appears
  # anywhere in the interface. Unlike most settings that promise is falsifiable
  # by a SINGLE screen, and the screen that leaks is by definition the one
  # nobody checked — so consolidating every date onto one path made the promise
  # true once, and this is what keeps it true.
  #
  # Its own job for the reason `i18n-catalogue` above has one: the input it
  # reads is the FRONTEND and the guard is PHP. Under `backend` it would skip on
  # every frontend-only PR, which is precisely the PR that adds the next screen.
  date-display:
    name: Date-display guard
    needs: changes
    if: needs.changes.outputs.date_display == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      # Same key as static-analysis, so this job normally restores rather than
      # resolves — the guard needs the autoloader and nothing else.
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Date-display guard
        run: php scripts/ci-date-display-guard.php

  # Migrations / seed / idempotency and the Security suite against a real
  # PostgreSQL engine. Measured 3 s of migrate+seed+re-migrate and 33 s of
  # Security — the whole job is well under two minutes, so it no longer has any
  # business sitting in front of a 30-minute Integration run.
  postgres-migrations:
    name: Migrations, idempotency & Security suite (PostgreSQL)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: whity
          POSTGRES_PASSWORD: whity_dev
          POSTGRES_DB: whity_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whity -d whity_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # The app reads configuration from $_ENV (not getenv); the CLI bootstrap
      # loads a .env file into $_ENV, so write one rather than rely on the runner's
      # variables_order including 'E'.
      - name: Write .env for the CLI bootstrap
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=whity_core
          DB_USER=whity
          DB_PASSWORD=whity_dev
          JWT_SECRET=ci_jwt_secret_min_32_chars_for_hs256_aaaa
          ENCRYPTION_KEY=ci_encryption_key_min_32_chars_bbbbbbbb
          INITIAL_ADMIN_PASSWORD=admin123
          INITIAL_USER_PASSWORD=user123
          INITIAL_SYSTEM_ADMIN_PASSWORD=systemadmin123
          INITIAL_SUPERUSER_PASSWORD=superuser123
          EOF

      - name: Run migrations on real PostgreSQL
        run: php public/index.php migrate run

      - name: Seed on real PostgreSQL
        run: php public/index.php seed

      - name: Re-run migrations (idempotency on PostgreSQL)
        run: php public/index.php migrate run

      # Permission-holder guard (#990): fail CI when a route gates on a permission
      # slug that NO role holds. Such a gate is not a permission check, it is a
      # lockout — it refuses every caller including the administrator it was
      # written for, from the moment it ships.
      #
      # It belongs in THIS job and no other: it is the only one with a migrated
      # database, and who holds a permission is a fact only a database knows. It
      # runs after migrate + seed because that is the state of a fresh install,
      # which is the deployment that gets locked out (it has whatever the
      # migrations granted and nothing an operator added by hand), and because the
      # guard refuses to answer against a database not migrated to this tree —
      # otherwise a branch that adds a gate AND its grant migration together would
      # be reported as a lockout it had already fixed.
      #
      # `roles:read` is the case it exists for: in the catalogue from migration 013
      # and held by nobody for ninety-eight migrations, invisible because nothing
      # consulted it, and one re-gate away from taking every administrator off the
      # roles screen (#977). #990 queues fourteen more re-gates of the same shape.
      - name: Permission-holder guard
        run: php scripts/ci-permission-holder-guard.php


      # JWT_SECRET and ENCRYPTION_KEY must match the .env written above so that
      # any test that bootstraps the app via public/index.php sees the same values.
      - name: Run Security suite on real PostgreSQL
        env:
          PHPUNIT_PG_DSN: "pgsql:host=localhost;port=5432;dbname=whity_core"
          PHPUNIT_PG_USER: whity
          PHPUNIT_PG_PASSWORD: whity_dev
          JWT_SECRET: ci_jwt_secret_min_32_chars_for_hs256_aaaa
          ENCRYPTION_KEY: ci_encryption_key_min_32_chars_bbbbbbbb
        run: vendor/bin/phpunit --testsuite Security

  postgres-integration:
    # Keep the `/5` here in step with the matrix below; the shard arithmetic
    # itself reads `strategy.job-total`, so only this label is manual.
    name: Integration shard ${{ matrix.shard }}/5 (PostgreSQL)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    # A real PostgreSQL service so the PHPUnit Integration suite runs against
    # the actual engine.  This catches Postgres-specific bugs the SQLite test
    # suite cannot — e.g. reserved-word identifiers (WC-65: `symmetric`),
    # rowCount() after SELECT, type coercion differences — which only surface on
    # a real PG engine.
    #
    # SchemaFromMigrations::make() detects PHPUNIT_PG_DSN and creates a fresh
    # per-test Postgres schema (namespace), runs the production migrations inside
    # it, and drops the schema at process exit, so the main whity_core database
    # is left intact after the suite. That per-class schema build is what makes
    # this suite slow (30m18s for 102 classes) and also what makes it shardable:
    # every shard gets its OWN postgres service, so no two shards can see each
    # other's schemas.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: whity
          POSTGRES_PASSWORD: whity_dev
          POSTGRES_DB: whity_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whity -d whity_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Write .env for the CLI bootstrap
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=whity_core
          DB_USER=whity
          DB_PASSWORD=whity_dev
          JWT_SECRET=ci_jwt_secret_min_32_chars_for_hs256_aaaa
          ENCRYPTION_KEY=ci_encryption_key_min_32_chars_bbbbbbbb
          INITIAL_ADMIN_PASSWORD=admin123
          INITIAL_USER_PASSWORD=user123
          INITIAL_SYSTEM_ADMIN_PASSWORD=systemadmin123
          INITIAL_SUPERUSER_PASSWORD=superuser123
          EOF

      # Each shard provisions the shared whity_core database the same way the
      # unsharded job did (~3 s total); tests that reach for the seeded baseline
      # rather than their own SchemaFromMigrations schema still find it.
      - name: Run migrations on real PostgreSQL
        run: php public/index.php migrate run

      - name: Seed on real PostgreSQL
        run: php public/index.php seed

      # Sharded by file, round-robin over the same deterministic sorted listing
      # in every shard, so the union is exactly the file set the
      # `<testsuite name="Integration"><directory>tests/Integration</directory>`
      # iterator walks — a new Integration test lands in exactly one shard with
      # no workflow edit and can never fall between shards.
      - name: Run Integration suite on real PostgreSQL (shard ${{ matrix.shard }})
        env:
          PHPUNIT_PG_DSN: "pgsql:host=localhost;port=5432;dbname=whity_core"
          PHPUNIT_PG_USER: whity
          PHPUNIT_PG_PASSWORD: whity_dev
          JWT_SECRET: ci_jwt_secret_min_32_chars_for_hs256_aaaa
          ENCRYPTION_KEY: ci_encryption_key_min_32_chars_bbbbbbbb
        run: |
          mapfile -t all < <(find tests/Integration -type f -name '*Test.php' | LC_ALL=C sort)
          total=${#all[@]}
          if [ "$total" -eq 0 ]; then
            echo "::error::no test files matched tests/Integration/**/*Test.php — refusing to run an empty shard"
            exit 1
          fi

          shards=${{ strategy.job-total }}
          index=$(( ${{ matrix.shard }} - 1 ))
          files=()
          for i in "${!all[@]}"; do
            if [ $(( i % shards )) -eq "$index" ]; then
              files+=("${all[$i]}")
            fi
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }}/${shards} selected 0 of ${total} Integration test files"
            exit 1
          fi

          echo "Shard ${{ matrix.shard }}/${shards}: ${#files[@]} of ${total} Integration test files"
          vendor/bin/phpunit "${files[@]}"

  # ---------------------------------------------------------------------------
  # The dialect gate: run the real-engine tests that live OUTSIDE tests/Integration
  # and tests/Security against real PostgreSQL as well as SQLite.
  #
  # Why this job exists
  # -------------------
  # Tests run SQLite, production runs PostgreSQL, and a whole class of defect is
  # invisible in that gap. Two that an adopter hit in one week:
  #
  #   * `GROUP_CONCAT(x SEPARATOR ',')` — valid SQLite, a syntax error on
  #     PostgreSQL (`string_agg`). Reached production; the endpoint 500'd.
  #   * removing a `CAST(id AS TEXT)` from a comparison — every test stayed green,
  #     because SQLite happily compares INTEGER to VARCHAR. PostgreSQL refuses:
  #     `operator does not exist: character varying = integer`.
  #
  # The second is the one that matters for design: NO helper library or query
  # builder can catch it, because nothing about the statement is malformed — it
  # is the engine's type-comparison semantics that differ. Only executing it on
  # the real engine finds it. Hence a job, not a lint.
  #
  # What it selects, and why by grep
  # --------------------------------
  # Every test file that builds a real engine (SchemaFromMigrations, or
  # RelationsSchema which delegates to it) and is not already covered by the
  # postgres-integration / postgres-migrations jobs above. Selecting by CONTENT
  # rather than by a hand-listed directory set means a new real-engine test is
  # picked up the day it is written — the failure mode of a curated list is that
  # it silently stops covering what people add, which is exactly the gap this job
  # exists to close. Files that never touch SQL are deliberately NOT re-run: the
  # cost of this job should track the SQL surface, not the suite size.
  #
  # What made it affordable
  # -----------------------
  # Re-running ~90 migrations per test is what previously priced real-Postgres
  # coverage out (30m18s for the 102 Integration classes; the #735 veto tests were
  # left SQLite-only for the same reason). SchemaFromMigrations now builds ONE
  # migration-fingerprinted template database per Postgres server and hands each
  # test a `CREATE DATABASE … TEMPLATE` copy — measured 58.9 s → 0.54 s per
  # engine. The template is keyed on the content of database/migrations, so it
  # rebuilds itself the moment a migration changes and is shared by every process
  # on the runner.
  # ---------------------------------------------------------------------------
  postgres-dialect:
    # Keep the `/2` here in step with the matrix below; the shard arithmetic
    # itself reads `strategy.job-total`, so only this label is manual.
    name: Dialect shard ${{ matrix.shard }}/2 (real-engine suites on PostgreSQL)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    # Its own Postgres service per shard, like postgres-integration: the template
    # database and the throwaway clones are per-server state, so two shards
    # sharing one server would contend on the same advisory lock for no gain.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: whity
          POSTGRES_PASSWORD: whity_dev
          POSTGRES_DB: whity_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whity -d whity_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # No `migrate run` / `seed` here, unlike postgres-integration: these tests
      # provision their own engine through SchemaFromMigrations and never read the
      # shared whity_core schema. The database exists only to host the template
      # and its clones.
      - name: Run the real-engine suites on real PostgreSQL (shard ${{ matrix.shard }})
        env:
          PHPUNIT_PG_DSN: "pgsql:host=localhost;port=5432;dbname=whity_core"
          PHPUNIT_PG_USER: whity
          PHPUNIT_PG_PASSWORD: whity_dev
          JWT_SECRET: ci_jwt_secret_min_32_chars_for_hs256_aaaa
          ENCRYPTION_KEY: ci_encryption_key_min_32_chars_bbbbbbbb
        run: |
          mapfile -t all < <(
            grep -rlE 'SchemaFromMigrations|RelationsSchema' tests --include='*Test.php' \
              | grep -v '^tests/Integration/' \
              | grep -v '^tests/Security/' \
              | LC_ALL=C sort
          )
          total=${#all[@]}
          # A refactor that renames the schema helper would otherwise turn this
          # gate into a silent no-op that still reports green.
          if [ "$total" -lt 40 ]; then
            echo "::error::selected only ${total} real-engine test files (expected 40+) — the selection is broken, not the suite"
            exit 1
          fi

          shards=${{ strategy.job-total }}
          index=$(( ${{ matrix.shard }} - 1 ))
          files=()
          for i in "${!all[@]}"; do
            if [ $(( i % shards )) -eq "$index" ]; then
              files+=("${all[$i]}")
            fi
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }}/${shards} selected 0 of ${total} real-engine test files"
            exit 1
          fi

          echo "Shard ${{ matrix.shard }}/${shards}: ${#files[@]} of ${total} real-engine test files"
          vendor/bin/phpunit --no-coverage "${files[@]}"

      # The whole job is worthless if the template cache quietly fell back to the
      # per-test migration run: the suite would still be green, just 100x slower,
      # and the next person would conclude dual-engine coverage is unaffordable.
      # SchemaFromMigrations logs that fallback to stderr; fail loudly instead.
      - name: Assert the template cache was actually used
        if: always()
        env:
          PGPASSWORD: whity_dev
        run: |
          templates=$(psql -h localhost -U whity -d whity_core -tAc \
            "SELECT count(*) FROM pg_database WHERE datname LIKE 'whity_phpunit_tpl_%'")
          echo "cached template databases on the server: ${templates}"
          if [ "${templates}" -lt 1 ]; then
            echo "::error::no template database was built — SchemaFromMigrations fell back to re-running every migration per test (see the stderr notice above for the reason)"
            exit 1
          fi

  # NOTE: Infection mutation testing moved OFF the per-PR path to a 6-hourly
  # scheduled run — see .github/workflows/mutation-testing.yml (WC-232ec317).
  # It took ~24 min (60s per-mutant timeout) and is a quality-TREND gate on main,
  # not a correctness gate; PRs still run SQLite + real-Postgres + PHPStan +
  # Playwright here. A mutation-coverage regression surfaces on the next
  # scheduled run after merge.

  render-service:
    name: Render microservice (build, unit tests, real Puppeteer smoke)
    needs: changes
    if: needs.changes.outputs.render_service == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: render-service/package-lock.json

      # A standalone Node project (own lockfile) — deliberately NOT part of the
      # root npm workspace (it shares no runtime code with web/, only bundles
      # web/packages/ui SOURCE in at build time; see scripts/build-harness.js).
      - name: Install dependencies
        working-directory: render-service
        run: npm ci

      # Bundles web/components/documents/print-document.tsx + packages/ui/src
      # in from source — the single most likely thing to break when either
      # side changes independently, and the cheapest to check (no Docker).
      - name: Build the render harness bundle
        working-directory: render-service
        run: npm run build:harness

      - name: Run unit tests (Puppeteer mocked)
        working-directory: render-service
        run: npm test

      # The real proof (ADR 0012): build the actual Docker image (system
      # Chromium + Arabic fonts baked in) and exercise a genuine Puppeteer
      # render — not just "it compiles". Mirrors the task's local verification
      # recipe so CI enforces the same bar every PR.
      - name: Build the whity_render Docker image
        run: docker build -f render-service/Dockerfile -t whity-render:ci .

      - name: Run a throwaway whity_render container
        run: |
          docker run -d --name whity_render_ci \
            -e RENDER_SHARED_SECRET=ci_render_shared_secret_min_32_chars_zz \
            -p 18130:8130 \
            whity-render:ci

      - name: Wait for the container to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18130/health > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "render service never became healthy"
          docker logs whity_render_ci || true
          exit 1

      # The image installs `chromium` unpinned, so the browser can move without
      # this repository moving (#1134). Two things have to hold on every build:
      # the image must be able to SAY which browser it has, and the boot probe
      # must find that browser still behaving the way the flowing mode's
      # paginator assumes. An image that cannot answer either is exactly the
      # "reports success without looking" shape this gate exists to prevent.
      #
      # `notable` and `inconclusive` PASS on purpose. A capability arriving is
      # news, not breakage; a probe that could not measure something is not
      # evidence that anything changed. Only `degraded` (a required behaviour
      # disagreed) and `error` (the probe could not run) fail.
      - name: The image must know its browser, and the browser must still behave
        run: |
          for _ in $(seq 1 60); do
            status=$(curl -fsS http://127.0.0.1:18130/health \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["capabilities"]["status"])')
            [ "${status}" = "pending" ] || break
            sleep 1
          done

          BODY=$(curl -fsS http://127.0.0.1:18130/health)
          echo "$BODY" | python3 -m json.tool

          # The body goes in as an ARGUMENT: `python3 -` reads the script from
          # stdin, so a pipe into it would be swallowed by the heredoc.
          python3 - "$BODY" <<'PY'
          import json, sys
          health = json.loads(sys.argv[1])
          browser = health["browser"]
          caps = health["capabilities"]

          if browser["source"] != "build" or not browser["version"]:
              raise SystemExit(
                  "::error::The render image cannot say which browser it was built with "
                  f"(source={browser['source']!r}, version={browser['version']!r}). "
                  "render-service/scripts/write-browser-info.js should have baked it in."
              )

          if browser["running_matches_build"] is False:
              raise SystemExit(
                  "::error::The browser answering at runtime "
                  f"({browser['running_version']}) is not the one the build recorded "
                  f"({browser['version']})."
              )

          if caps["status"] in ("degraded", "error"):
              for line in caps["required_failures"] or [caps["error"]]:
                  print(f"::error::capability probe: {line}")
              raise SystemExit(f"::error::capability probe status is {caps['status']}")

          # At RUNTIME a probe that never lands gates nothing, deliberately.
          # In CI it is a failure: a probe that cannot finish inside a minute
          # on a quiet runner is a probe nobody will get an answer from.
          if caps["status"] in ("pending", "not_run"):
              raise SystemExit(f"::error::capability probe never landed (status {caps['status']})")

          print(f"Browser {browser['version']}; capability probe: {caps['status']} in {caps['ms']} ms.")
          for line in caps["notable"]:
              print(f"::warning::browser capability changed — {line}")
          for probe in caps["unknown"]:
              print(f"::warning::capability probe could not be measured: {probe}")
          PY

      # A real render round-trip: text + a math element (KaTeX) + a barcode +
      # Arabic text (the hard cross-cutting RTL requirement). Structural/smoke
      # checks only (per the task brief, exact golden-image pixel diffing is
      # too fragile across environments): valid non-trivial PDF bytes with
      # multiple distinct embedded font subsets (real text/math/barcode
      # content was actually shaped, not a blank page). Arabic legibility
      # itself (not tofu) was verified manually with a real screenshot — see
      # the PR description — rather than by grepping for a font family name in
      # the PDF, which turned out NOT to be a reliable signal: a manual check
      # showed Chromium can embed a correctly-shaped Arabic glyph subset under
      # a font resource name that does not literally contain "Arabic".
      - name: Real render smoke test (text + math + barcode + Arabic)
        run: |
          cat > /tmp/render-payload.json <<'PAYLOAD'
          {
            "template": {
              "version": 2,
              "page": { "widthMm": 100, "heightMm": 60, "marginMm": 2, "background": "#ffffff" },
              "placeholders": [],
              "pages": [
                {
                  "id": "p1",
                  "elements": [
                    { "id": "t1", "type": "text", "x": 2, "y": 2, "w": 96, "h": 12, "rotation": 0, "z": 1,
                      "text": "مرحبا بالعالم",
                      "style": { "fontSize": 18, "fontWeight": "normal", "fontStyle": "normal", "align": "center", "vAlign": "middle", "color": "#000000", "direction": "rtl" } },
                    { "id": "m1", "type": "math", "x": 2, "y": 16, "w": 60, "h": 14, "rotation": 0, "z": 2,
                      "expression": "E = mc^2", "block": false },
                    { "id": "b1", "type": "barcode", "x": 2, "y": 32, "w": 60, "h": 20, "rotation": 0, "z": 3,
                      "symbology": "code128", "value": "WC-DOCDESIGNER-1", "showText": true }
                  ]
                }
              ]
            },
            "dataRows": [{}]
          }
          PAYLOAD
          curl -fsS -X POST http://127.0.0.1:18130/render \
            -H 'Content-Type: application/json' \
            -H 'X-Render-Secret: ci_render_shared_secret_min_32_chars_zz' \
            --data @/tmp/render-payload.json \
            -o /tmp/render-output.pdf

          test -s /tmp/render-output.pdf
          head -c 5 /tmp/render-output.pdf | grep -q '%PDF-'

          # A real (non-blank) render embeds several distinct font subsets —
          # one for the body text, one for the KaTeX math glyphs, at least.
          font_count=$(grep -a -c 'BaseFont' /tmp/render-output.pdf || true)
          echo "embedded BaseFont occurrences: ${font_count}"
          test "${font_count}" -ge 2

          size=$(stat -c%s /tmp/render-output.pdf)
          echo "PDF size: ${size} bytes"
          test "${size}" -gt 5000

      # ---------------------------------------------------------------------
      # The FLOWING render mode (#1072).
      #
      # `documents.render_enabled` defaults to false, so nothing in a fresh
      # install ever calls the render tier and a feature here has no natural
      # way to be exercised. These steps are that way. They generate a
      # synthetic document of the size this mode exists for — over a hundred
      # pages, sixty tables, ninety figures, front matter referencing every
      # one — render it through the real container, and then check the
      # RESULTING PDF rather than the exit status of the thing that made it.
      #
      # The check that matters is the last one: it opens the PDF, finds the
      # page each table and figure is actually printed on, reads the page
      # number printed beside the matching front-matter entry, and compares
      # them. A contents list of ninety plausible-looking wrong numbers is a
      # worse outcome than no contents list, and only this check can tell the
      # two apart.
      - name: Generate the synthetic flowing-document fixture
        working-directory: render-service
        run: |
          node scripts/generate-flow-fixture.js --direction rtl --out /tmp/flow-rtl.json
          node scripts/generate-flow-fixture.js --direction ltr --out /tmp/flow-ltr.json
          ls -l /tmp/flow-rtl.json /tmp/flow-ltr.json

      - name: Flowing render round-trip (Arabic/RTL, 130 pages)
        run: |
          # `run:` steps are bash -e, so a failing curl would abort before the
          # status could be read. Disable the abort just long enough to capture
          # it, then report the ARTEFACT rather than the status.
          set +e
          curl -sS -X POST http://127.0.0.1:18130/render/flow \
            -H 'Content-Type: application/json' \
            -H 'X-Render-Secret: ci_render_shared_secret_min_32_chars_zz' \
            --data @/tmp/flow-rtl.json \
            -D /tmp/flow-rtl.headers \
            -o /tmp/flow-rtl.pdf
          curl_status=$?
          set -e
          echo "curl exit: ${curl_status}"
          test "${curl_status}" -eq 0

          # Verify the ARTEFACT, not the status. A Buffer coming back is not
          # evidence that the document is right.
          test -s /tmp/flow-rtl.pdf
          head -c 5 /tmp/flow-rtl.pdf | grep -q '%PDF-'
          cat /tmp/flow-rtl.headers

          pages=$(tr -d '\r' < /tmp/flow-rtl.headers | awk 'tolower($1)=="x-render-page-count:"{print $2}')
          front=$(tr -d '\r' < /tmp/flow-rtl.headers | awk 'tolower($1)=="x-render-front-matter-pages:"{print $2}')
          echo "reported pages: ${pages} (of which ${front} are generated front matter)"

          # The whole point of this mode is a document whose length it decides.
          # Below a hundred pages the fixture is not exercising pagination at
          # the size that matters, and a single page means it collapsed.
          test -n "${pages}"
          test "${pages}" -ge 120
          test "${front}" -ge 5
          echo "FLOW_PAGES=${pages}" >> "$GITHUB_ENV"

      - name: Flowing render round-trip (LTR)
        run: |
          curl -fsS -X POST http://127.0.0.1:18130/render/flow \
            -H 'Content-Type: application/json' \
            -H 'X-Render-Secret: ci_render_shared_secret_min_32_chars_zz' \
            --data @/tmp/flow-ltr.json \
            -D /tmp/flow-ltr.headers \
            -o /tmp/flow-ltr.pdf
          test -s /tmp/flow-ltr.pdf
          head -c 5 /tmp/flow-ltr.pdf | grep -q '%PDF-'
          pages=$(tr -d '\r' < /tmp/flow-ltr.headers | awk 'tolower($1)=="x-render-page-count:"{print $2}')
          echo "reported pages: ${pages}"
          test "${pages}" -ge 120

      # THE acceptance test. Reads the finished PDFs and checks that the entry
      # for a given item names the page that item is actually on — plus that
      # the running footer on physical page N says N.
      - name: Cross-reference page numbers are CORRECT, read back from the PDF
        working-directory: render-service
        run: |
          node scripts/verify-flow-pdf.js --pdf /tmp/flow-rtl.pdf --direction rtl --expect-pages "${FLOW_PAGES}"
          node scripts/verify-flow-pdf.js --pdf /tmp/flow-ltr.pdf --direction ltr

      # Bidi is checked as GEOMETRY, in the real image, because that is the
      # only place the question can be answered: whether a page number lands at
      # the correct edge of a right-to-left line is about a browser and a flex
      # row, not about a string. Runs inside the container because that is
      # where the Arabic fonts are.
      - name: Arabic/RTL contents-entry and running-head geometry
        run: |
          # `scripts/.` — the CONTENTS, not the directory. /app/scripts already
          # exists in the image (it holds write-browser-info.js, #1134), and
          # `docker cp <dir> <existing dir>` would nest it as
          # /app/scripts/scripts rather than merging.
          docker cp render-service/scripts/. whity_render_ci:/app/scripts
          docker exec whity_render_ci node scripts/check-flow-rtl-geometry.js

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs whity_render_ci || true

      - name: Tear down the throwaway container
        if: always()
        run: docker rm -f whity_render_ci || true

  web:
    name: Frontend types, tests & generated-artifact drift
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          # Single lockfile at the workspace root (npm workspaces).
          cache-dependency-path: package-lock.json

      # npm workspaces install the whole repo from the root lockfile; the web
      # scripts below still run with working-directory: web (bins resolve from
      # the hoisted root node_modules).
      - name: Install dependencies
        working-directory: .
        run: npm ci

      # Fail on a critical advisory in an installed npm dependency
      # (WC-232ec317). Temporarily lowered from --audit-level=high: sharp's
      # CVE-2026-33327 et al. (GHSA-f88m-g3jw-g9cj) has no forward fix — next
      # vendors its own pinned sharp range (still ^0.34.5 as of next@16.2.11)
      # and the only "fix" npm offers is downgrading next to 14.2.35, which is
      # not viable. Re-tighten to --audit-level=high once Next.js ships a
      # release with an unaffected sharp range.
      - name: npm security audit
        working-directory: .
        run: npm audit --audit-level=critical

      # The committed lib/api/schema.d.ts must match a fresh generation from
      # public/openapi.json — API changes that skip `npm run generate:api`
      # would ship a typed client that lies about the contract (WC-168).
      - name: Typed-client schema drift check
        run: |
          npm run generate:api
          git diff --exit-code -- lib/api/schema.d.ts

      # The SAME spec also generates the PUBLISHED @amroksaleh/api-client
      # types, and that copy had no drift gate at all — it went ~4 weeks and
      # 8,000 lines out of date while the web copy above stayed honest, because
      # only the web one was checked. Downstream consumers install the package,
      # not web/, so the unchecked copy was the one that mattered.
      #
      # `frontend` already filters on packages/** and public/openapi.json, so
      # this job runs whenever either side can move.
      - name: Typed-client schema drift check (@amroksaleh/api-client)
        working-directory: packages/api-client
        run: |
          npm run generate
          git diff --exit-code -- src/schema.d.ts

      # The committed design-token outputs must match the generator (base.json
      # is the single source of truth for styling variables).
      - name: Design-token drift check
        run: npm run tokens:check

      # The shadcn registry manifest must stay buildable; its output is
      # generated at build time (prebuild) and never committed.
      - name: Registry build smoke
        run: npm run registry:build

      - name: Type check
        run: npx tsc --noEmit

      # `packages/ui` ships RAW SOURCES (exports "." -> "./src/index.ts"), so
      # until now its only type checking was whatever each consumer's tsconfig
      # happened to enforce — the library's effective strictness was its
      # strictest consumer's, and its stories were checked by nobody. A dead
      # import that `web` tolerated broke `templates/tauri-desktop` outright
      # (it sets noUnusedLocals). Check the library on its own terms instead,
      # under its own tsconfig — which includes the .stories.tsx files.
      - name: Type check @amroksaleh/ui
        working-directory: .
        run: npm run typecheck -w @amroksaleh/ui

      # #1050. The `Type check` step above runs under web/'s tsconfig, which
      # does not include this tree — so the desktop template's own compiler
      # settings (strict, noUnusedLocals, noUnusedParameters) were enforced
      # only by `npm run build` in tauri-desktop-release.yml, which fires on a
      # `tauri-desktop-vX.Y.Z` TAG. Every type error between two releases was
      # therefore discovered at release time, by whoever cut the release,
      # rather than on the PR that introduced it.
      - name: Type check templates/tauri-desktop
        working-directory: .
        run: npm run typecheck -w whity-tauri-desktop-template

      # The Vite build, not just tsc, because it is the only check in the repo
      # that resolves `@amroksaleh/*` through each package's real `exports` map.
      # web/'s Jest maps those specifiers via tsconfig `paths` and packages/ui
      # ships raw sources, so a subpath import that the package does not
      # actually publish type-checks and tests clean everywhere else and breaks
      # HERE — see the trade-off documented in web/jest.config.mjs.
      # `vite build` rather than `npm run build -w`, which would re-run the tsc
      # the previous step already did. ~6s.
      - name: Build templates/tauri-desktop
        working-directory: templates/tauri-desktop
        run: npx vite build

      # ESLint gate (WC-122): zero errors required; warnings are tolerated.
      # Runs after the WC-195 debt clearance so the gate starts clean.
      - name: Lint
        run: npm run lint

      # A full production build gates build-breaking RSC/route errors and a
      # broken prebuild shadcn-registry generation, so they fail CI instead of
      # surfacing at deploy (WC-180). `npm run build` runs the `prebuild`
      # registry hook then `next build`. On Next 16 `next build` no longer runs
      # ESLint (`next lint` was removed), so this validates ONLY the registry
      # generation plus build-breaking RSC/route/type errors.
      # Next.js reuses its compiler/output cache in .next/cache across builds;
      # restoring it makes `next build` incremental. Keyed on the lockfile plus
      # source hash so a dependency or source change seeds from the most recent
      # cache (restore-keys) rather than building fully cold.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('web/**/*.[jt]s', 'web/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-
            nextjs-

      - name: Build (production)
        run: npm run build

      - name: Run Jest
        run: npx jest

      # Gate both component galleries so a broken story can't land silently
      # (WC-3f9b0364). Both workspaces define build-storybook; run from the repo
      # root so the -w workspace flags resolve.
      - name: Build Storybook galleries
        working-directory: .
        run: |
          npm run build-storybook -w @amroksaleh/ui
          npm run build-storybook -w web

  # ---------------------------------------------------------------------------
  # The single check branch protection requires.
  #
  # Every substantive job above is gated on a path filter (`needs.changes`), so
  # a frontend-only PR never runs `static-analysis` and a backend-only PR never
  # runs `web`. Requiring those jobs directly in branch protection would be a
  # trap: GitHub waits for a required check that will never report, and the PR
  # can never merge. Requiring only the always-on jobs instead would mean the
  # protection silently stops covering whatever is added next.
  #
  # So this job always runs, depends on all of them, and reports one verdict.
  # A SKIPPED job is a pass — that is the path filter working as designed. A
  # failed or cancelled one fails the gate.
  #
  # Adding a job above? Add it to `needs` here, or it is not covered.
  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - test
      - coverage
      - static-analysis
      - history-guards
      - i18n-catalogue
      - date-display
      - postgres-migrations
      - postgres-integration
      - postgres-dialect
      - render-service
      - web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Without this, adding a job above and forgetting to list it in `needs`
      # silently drops it from the protected gate: it still runs, still goes
      # red, and merging is no longer blocked by it. That is the failure this
      # whole job exists to prevent, so it is checked rather than trusted to a
      # comment.
      #
      # The SECOND check is the same failure one level down, and it is worse
      # because it is silent in both directions. A job gated on
      # a change filter that is not declared in the `changes` job's `outputs:`
      # reads back as an EMPTY string, never equals 'true', and skips
      # on every run forever — and a skipped job is a passing job to the gate
      # above, so nothing goes red. #1068 shipped a guard wired exactly that way
      # and it was dead on arrival; the only thing that caught it was a person
      # reading the check list.
      - name: The gate covers every job, and every filter it gates on exists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, yaml
          raw = open('.github/workflows/automated-tests.yml').read()
          d = yaml.safe_load(raw)
          failed = False

          jobs = set(d['jobs']) - {'gate'}
          needs = set(d['jobs']['gate']['needs'])
          for j in sorted(jobs - needs):
              print(f"::error::job '{j}' is not in the CI gate's `needs`, so branch protection does not cover it")
              failed = True
          if not failed:
              print(f"gate covers all {len(jobs)} job(s)")

          declared = set(d['jobs']['changes'].get('outputs') or {})
          referenced = set(re.findall(r'needs\.changes\.outputs\.([A-Za-z0-9_]+)', raw))
          for name in sorted(referenced - declared):
              print(f"::error::`needs.changes.outputs.{name}` is read but not declared in the `changes` job's `outputs:` — it resolves to an empty string, so every job gated on it skips silently and forever")
              failed = True
          if referenced <= declared:
              print(f"every one of {len(referenced)} change filter(s) is declared")

          sys.exit(1 if failed else 0)
          PY

      - name: Every required job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          # `skipped` is deliberately allowed; `failure` and `cancelled` are not.
          # A cancelled job is treated as a failure on purpose: it means the run
          # did not finish, so nothing was actually verified.
          bad=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failed — these jobs did not pass:"
            printf '::error::  %s\n' $bad
            exit 1
          fi
          echo "CI gate passed."
