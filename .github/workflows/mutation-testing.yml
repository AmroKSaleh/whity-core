name: Mutation Testing (scheduled)

# Infection mutation testing (WC-a29727a5, scoped to Auth / Tenant / Delegation)
# runs on a 6-hour schedule instead of on every PR. Rationale (WC-232ec317): the
# job takes ~24 min (the 60s per-mutant timeout in infection.json5 lets slow
# covered mutants run to completion so Covered-Code MSI is stable, not flaky) —
# too slow to gate every PR. It is a quality-TREND gate on `main`, not a
# correctness gate: PRs still run SQLite + real-Postgres + PHPStan + Playwright.
# A mutation-coverage regression therefore surfaces on the next scheduled run
# after merge rather than blocking the PR.
#
# The `changes` guard skips the run when `main` has had no new commits since the
# previous window ("only if there is new code") — no point re-mutating an
# unchanged tree every 6 hours. `workflow_dispatch` always runs (manual force).
#
# Why there is a gate job below (WC-877)
# --------------------------------------
# Skipping the Infection job used to make the RUN report `success`. GitHub
# ignores skipped jobs when it computes a run conclusion, so `gh run list` and
# the API both said green whether the mutation suite had passed or had never
# started. Nothing at run level told the two apart.
#
# That is not theoretical here. Run 32107507319 executed Infection against
# 896b0962 and FAILED; the next nine scheduled runs, on the SAME commit, skipped
# the job and reported `success`. The history read as an unbroken green streak
# over a tree whose mutation suite was broken throughout — and reading it that
# way sent an investigation eleven days in the wrong direction, blaming a
# same-day merge for a regression that predated it.
#
# The gate does not merely make the skip louder. It changes what green MEANS:
#
#     this run is green only if the current tip of main has actually been
#     mutation-tested, and passed.
#
# A skipped window therefore inherits the verdict of the last window that really
# executed — including its red — and says in the run summary exactly which run
# that was. A tip that no run has ever mutated (a dropped cron walks the 6h30m
# window past a commit) is red as stale, which is the general form of the bug:
# a gate that has not executed is indistinguishable from one that always passes.
# The logic lives in scripts/ci-mutation-gate.py so it can be replayed against
# any historical run id, because a gate nobody has watched fail is not known to
# work.
on:
  schedule:
    - cron: '0 */6 * * *'   # scoped run — every 6 hours, on the hour
  workflow_dispatch: {}

permissions:
  contents: read
  # The gate reads this workflow's own run and job history to find the last
  # window in which Infection really executed.
  actions: read

jobs:
  changes:
    name: Gate on new commits since last window
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout main with recent history
        uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Determine whether main moved since the last window
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — running regardless of new commits."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 390 minutes = 6h30m: a 30-minute overlap over the 6h cron so a commit
          # landing near a window boundary is never missed (an occasional harmless
          # double-run on the same commit is fine; a missed commit is not).
          if [ -n "$(git log --since='390 minutes ago' --format=%H)" ]; then
            echo "New commits on main in the last 6h30m — running mutation tests."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Mutation window"
              echo
              echo "RUNNING — main moved in the last 6h30m (tip \`$(git rev-parse --short HEAD)\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new commits since the last window — skipping mutation run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            # Say it on the run page, not only in this job's log. The run
            # conclusion cannot express "did not run", so the summary has to.
            {
              echo "## Mutation window"
              echo
              echo "SKIPPED — main has not moved since the last window"
              echo "(tip \`$(git rev-parse --short HEAD)\`). The Infection job did NOT run;"
              echo "see the Mutation gate job below for what this run actually verified."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  mutation-testing:
    name: Infection mutation testing (Auth/Tenant/Delegation)
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Infection mutation testing
        env:
          INITIAL_SYSTEM_ADMIN_PASSWORD: ci_initial_admin_password_min_32_chars_cc
          JWT_SECRET: ci_jwt_secret_min_32_chars_for_hs256_aaaa
          ENCRYPTION_KEY: ci_encryption_key_min_32_chars_bbbbbbbb
        # Per-mutant timeout is configured via "timeout": 60 in infection.json5
        # (this Infection version has no --timeout CLI flag). 60s stops the slower
        # CI runner from false-timing-out covered mutants at the 10s default, which
        # was deflating Covered-Code MSI. Thresholds (minMsi / minCoveredMsi) also
        # live in infection.json5 — see the derivation comment there before changing.
        run: vendor/bin/infection --no-interaction --no-progress --threads=max

      - name: Upload Infection log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infection-log
          path: |
            infection-log.txt
            infection-summary.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The one job that always runs and always reports — the aggregator pattern
  # `automated-tests.yml` (`CI gate`) and `e2e.yml` (`E2E gate`) already use,
  # brought to the workflow that most needed it.
  #
  # This is NOT a required check: mutation testing is a quality-TREND gate on
  # `main`, not a PR gate. It exists so the run page states what the run
  # verified, and so a run that verified nothing cannot pass itself off as one
  # that did.
  #
  # Adding a job above? Add it to `needs` here, or it is not covered.
  mutation-gate:
    name: Mutation gate
    if: always()
    needs:
      - changes
      - mutation-testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same self-check as the other two gates. Without it, adding a job above
      # and forgetting to list it in `needs` silently drops it from the verdict:
      # it still runs, still goes red, and this job still reports green.
      - name: The gate must cover every job in this workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open('.github/workflows/mutation-testing.yml'))
          jobs = set(d['jobs']) - {'mutation-gate'}
          needs = set(d['jobs']['mutation-gate']['needs'])
          missing = sorted(jobs - needs)
          if missing:
              for j in missing:
                  print(f"::error::job '{j}' is not in the mutation gate's `needs`, so the gate does not cover it")
              sys.exit(1)
          print(f"gate covers all {len(jobs)} job(s)")
          PY

      # `skipped` is allowed here — a skipped Infection job is the `changes`
      # filter working, and whether that skip is ACCEPTABLE is the next step's
      # question, not this one's. `failure` and `cancelled` are not allowed: a
      # cancelled job finished nothing, so nothing was verified.
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key')
          if [ -n "$bad" ]; then
            echo "::error::Mutation gate failed — these jobs did not pass:"
            printf '::error::  %s\n' $bad
            exit 1
          fi
          echo "All jobs succeeded or were skipped."

      # The part that makes green mean something. Runs even when the step above
      # failed, so the run summary always records what was actually verified.
      - name: Report what this run actually verified
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci-mutation-gate.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --head-sha "${{ github.sha }}" \
            --this-result "${{ needs.mutation-testing.result }}"

# NOTE (WC-232ec317, corrected): a nightly whole-src "deep" Infection scan was
# prototyped here but deferred. The original note blamed test-ORDER isolation.
# That diagnosis was wrong, and it cost a later investigation a day, so the real
# mechanism is written down here.
#
# Infection does NOT force executionOrder="random". The config it generates
# (/tmp/infection/phpunitConfiguration.initial.infection.xml) copies phpunit.xml
# verbatim — executionOrder="depends,defects" included — adding only
# stopOnDefect and cacheResult="false". The initial run is DETERMINISTIC, which
# is why it aborts at the identical test number on CI and locally.
#
# What actually aborts it is STDERR. Infection\Process\Runner\InitialTestsRunner
# SIGTERMs the initial test process on the first byte written to STDERR:
#
#     $process->run(function (string $type) use ($process): void {
#         if ($type === Process::ERR) { $process->stop(); }
#
# so the job dies with "PHPUnit reported an exit code of 143" and NO F/E marker
# and no PHPUnit summary — while reporting the boilerplate "tests must be in a
# passing state ... Infection runs the test suite in a RANDOM order ... hidden
# dependencies". That message describes a bug this repository did not have.
#
# In the CLI SAPI error_log() writes to STDERR, so ANY error_log() reached by a
# test aborts the run even when every test passes. The string this note used to
# cite as evidence of an order-dependent test —
# "[AdminApiHandler] stats failed: relation \"users\" does not exist" — is an
# error_log() in an AdminApiHandler catch block: the same STDERR mechanism, and
# a real defect in its own right rather than an isolation problem.
#
# The scoped run above was NOT "unaffected": it failed this way on every run
# that actually executed from 5bc5c2f1 (#722, 2026-08-09) until the fix, hidden
# because the `changes` gate above skips the job when main has not moved and
# GitHub reports a run whose only real job was SKIPPED as green. That hiding
# place is closed (WC-877): a skipped window now inherits the last real
# verdict, so the same breakage would have shown as an unbroken RED streak.
#
# Prerequisite for the deep scan (infection.full.json5) is therefore that the
# `default` suite reach no error_log() on a green run — the tenant-scoping bug
# behind the AdminApiHandler line included — not test-order independence.
