# WC-e: deploy the published release images to a staging host over SSH.
#
# Flow: pick an image tag -> copy docker-compose.staging-remote.yml to the host
# -> write .env.staging from a secret -> `docker compose pull && up -d` ->
# `migrate run` inside the app container -> poll GET /api/health AND GET /login
# on the host until both return 200, then read GET /api/build. A deploy that
# does not end with a healthy API, a rendering UI *and* a schema the running
# code expects FAILS the run.
#
# The UI check is not belt-and-braces (WHIT-588): v0.2.0 deployed green on
# /api/health alone while shipping no frontend at all, so "the deploy worked"
# and "a human can use it" were two different facts and only the first was
# being measured.
#
# The build-identity check is the third such fact (#1049): staging was later
# found running a database 15 migrations behind its own checkout, with
# /api/health answering ok the whole time, because a version constant cannot
# report anything about whether a deploy landed.
#
# ACTIVATE-BY-CONFIG: this does nothing until you set the staging secrets. The
# `preflight` job checks whether STAGING_SSH_HOST is set and, if not, the deploy
# job is skipped and the run succeeds with a notice — so merging this workflow
# never turns the pipeline red on repos that have no staging host yet.
#
# Required secrets to activate:
#   STAGING_SSH_HOST   host / IP of the staging box
#   STAGING_SSH_USER   ssh user
#   STAGING_SSH_KEY    that user's PRIVATE key (PEM)
#   STAGING_ENV        the FULL contents of .env.staging (see .env.staging.example)
# Optional secrets / vars:
#   STAGING_SSH_PORT       ssh port                 (default 22)
#   STAGING_DEPLOY_DIR     dir on the host          (default /opt/whity-staging)
#   STAGING_APP_PORT       host port the app binds  (default 8100)
#   STAGING_WEB_PORT       host port the UI binds   (default 3100)
#   STAGING_REGISTRY_USER  GHCR user (private image pull)
#   STAGING_REGISTRY_TOKEN GHCR read:packages token (private image pull)
name: Deploy to staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. v1.2.3). Defaults to latest.'
        required: false
        default: 'latest'
  # Auto-deploy the newest published release to staging.
  workflow_run:
    workflows: ['Release']
    types: [completed]

permissions:
  contents: read

jobs:
  # Gate: only proceed when a staging host is actually configured. secrets can't
  # be used in a job-level `if:`, so we surface "is it configured?" as an output.
  preflight:
    name: Check staging is configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          if [ -n "$HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Staging host is configured — deploy will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_SSH_HOST is not set — skipping staging deploy (activate-by-config)."
          fi

  deploy:
    name: Deploy + migrate + health-check
    runs-on: ubuntu-latest
    needs: preflight
    # Skip cleanly when unconfigured, and never deploy a release that failed.
    if: >-
      needs.preflight.outputs.configured == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # One tag drives BOTH tiers. The release job publishes them together under
      # identical tags, so resolving them from the same `tag` here is what keeps
      # a deploy from pairing a new API with a stale UI.
      - name: Resolve image references
        id: image
        env:
          # workflow_dispatch supplies a tag; a Release-triggered run deploys :latest
          # (the tag the release just pushed alongside the version tag).
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${INPUT_TAG:-latest}"
          echo "ref=${name}:${tag}" >> "$GITHUB_OUTPUT"
          echo "web_ref=${name}/web:${tag}" >> "$GITHUB_OUTPUT"
          echo "Deploying images: ${name}:${tag} + ${name}/web:${tag}"

      - name: Copy compose file to the host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          source: docker-compose.staging-remote.yml
          target: ${{ secrets.STAGING_DEPLOY_DIR || '/opt/whity-staging' }}

      - name: Deploy over SSH (pull -> up -> migrate -> health)
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          WEB_IMAGE_REF: ${{ steps.image.outputs.web_ref }}
          STAGING_ENV: ${{ secrets.STAGING_ENV }}
          DEPLOY_DIR: ${{ secrets.STAGING_DEPLOY_DIR || '/opt/whity-staging' }}
          APP_PORT: ${{ secrets.STAGING_APP_PORT || '8100' }}
          WEB_PORT: ${{ secrets.STAGING_WEB_PORT || '3100' }}
          REGISTRY_USER: ${{ secrets.STAGING_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.STAGING_REGISTRY_TOKEN }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          # Pass the CI-side env through to the remote shell so the heredoc/secrets
          # never get expanded or logged on the runner.
          envs: IMAGE_REF,WEB_IMAGE_REF,STAGING_ENV,DEPLOY_DIR,APP_PORT,WEB_PORT,REGISTRY_USER,REGISTRY_TOKEN
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            # Write the app secrets file (0600) from the STAGING_ENV secret.
            umask 077
            printf '%s\n' "$STAGING_ENV" > .env.staging

            COMPOSE="docker compose -p whity-staging -f docker-compose.staging-remote.yml --env-file .env.staging"

            # Compose resolves these out of the environment. Exported once rather
            # than prefixed per invocation so `pull`, `up`, `exec` and `logs`
            # cannot disagree about which images the stack is made of — and so
            # adding a service does not mean remembering another prefix.
            export WHITY_IMAGE="$IMAGE_REF"
            export WHITY_WEB_IMAGE="$WEB_IMAGE_REF"
            export APP_PORT_HOST="$APP_PORT"
            export WEB_PORT_HOST="$WEB_PORT"

            # Log in to GHCR only if a private-pull token was provided.
            if [ -n "${REGISTRY_TOKEN:-}" ]; then
              echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${REGISTRY_USER:-x}" --password-stdin
            fi

            echo "==> Pulling ${IMAGE_REF} + ${WEB_IMAGE_REF}"
            $COMPOSE pull

            echo "==> Starting stack"
            $COMPOSE up -d

            # Wait for Postgres to accept connections before migrating.
            echo "==> Waiting for Postgres"
            for i in $(seq 1 30); do
              if $COMPOSE exec -T postgres pg_isready -U "${DB_USER:-whity}" >/dev/null 2>&1; then
                echo "Postgres ready"; break
              fi
              sleep 2
              [ "$i" -eq 30 ] && { echo "Postgres did not become ready"; $COMPOSE logs postgres; exit 1; }
            done

            # Migrations are idempotent; seeding is a deliberate one-time step and
            # is intentionally NOT run here so a redeploy never mutates staging data.
            echo "==> Running migrations"
            $COMPOSE exec -T frankenphp php public/index.php migrate run

            # API gate: poll the backend on the host until it serves 200, or fail.
            echo "==> API health check http://localhost:${APP_PORT}/api/health"
            api_ok=false
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${APP_PORT}/api/health" || true)
              echo "Attempt $i/30 -> HTTP $code"
              if [ "$code" = "200" ]; then
                api_ok=true
                curl -s "http://localhost:${APP_PORT}/api/health" || true
                echo
                break
              fi
              sleep 2
            done
            if [ "$api_ok" != true ]; then
              echo "API health check failed — dumping app logs:"
              $COMPOSE logs --tail=100 frankenphp
              exit 1
            fi

            # Build-identity gate (#1049). A green /api/health says the process
            # is alive; it reports CoreVersion::VERSION, a constant in the
            # source, and says nothing about whether THIS deploy landed. The
            # schema half is the part that has actually failed here: staging was
            # found sitting at migration 100 under a checkout at 115 — the
            # documents, routing and collections tables absent — while
            # /api/health answered {"status":"ok"} throughout, and it was found
            # by hand weeks later. `migrate run` above has just completed, so a
            # non-zero pending count means the workers now serving traffic are
            # not the code the database was migrated for.
            echo "==> Build identity http://localhost:${APP_PORT}/api/build"
            build=$(curl -s --max-time 10 "http://localhost:${APP_PORT}/api/build" || true)
            echo "$build"
            pending=$(printf '%s' "$build" | grep -o '"pending_migration_count":[^,}]*' | cut -d: -f2 | tr -d ' "')
            if [ "$pending" != "0" ]; then
              echo "Deployed backend reports pending_migration_count=${pending:-<unreadable>} — the schema is not the one this code expects."
              $COMPOSE logs --tail=100 frankenphp
              exit 1
            fi

            # UI gate (WHIT-588): fetch a real rendered page off the web tier.
            # /login is the route every deployment must serve before a human can
            # do anything, and it is the one that was silently missing while this
            # very workflow reported a successful deploy.
            echo "==> UI check http://localhost:${WEB_PORT}/login"
            web_ok=false
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${WEB_PORT}/login" || true)
              echo "Attempt $i/30 -> HTTP $code"
              if [ "$code" = "200" ]; then
                web_ok=true
                break
              fi
              sleep 2
            done
            if [ "$web_ok" != true ]; then
              echo "UI check failed — dumping web logs:"
              $COMPOSE logs --tail=100 web
              exit 1
            fi

            echo "Staging is healthy: API answering and UI rendering."
