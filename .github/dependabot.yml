version: 2
updates:
  # Root Composer package (whity-core backend).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      composer-minor-patch:
        update-types: ["minor", "patch"]

  # Plugin SDK — published standalone; keep its own update cadence since a
  # backward-compat contract applies here that doesn't apply to the app.
  - package-ecosystem: "composer"
    directory: "/sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      composer-minor-patch:
        update-types: ["minor", "patch"]

  # npm workspace root (covers web/, packages/ui, packages/api-client).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # The render service, which has its OWN package.json and lockfile and is NOT a
  # workspace of the root — so nothing above reaches it.
  #
  # Its absence here is not theoretical. A critical proxy-addr advisory was fixed
  # in the root lockfile and closed, while the identical dependency sat
  # unpatched in render-service/package-lock.json for months: GitHub kept
  # RAISING the alert, because the scanner reads every lockfile, but Dependabot
  # never opened a PR for it, because no ecosystem/directory pair covered the
  # directory. The alert then reads as a regression rather than as a gap.
  #
  # Any future sidecar with its own lockfile needs its own entry for the same
  # reason. The root entry covers the workspaces only because they share the
  # root lockfile.
  - package-ecosystem: "npm"
    directory: "/render-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions workflow dependencies (would have surfaced #198).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Dockerfile base images.
  #
  # THIS ENTRY ONLY WORKS IF THE BASE IS PINNED TO AN EXACT PATCH, and it spent
  # months proving the point. Dependabot bumps a version string; the base was
  # the floating `dunglas/frankenphp:1-php8.4`, which has no version string to
  # bump — the tag is already correct for every patch release ever published —
  # so the watcher ran every week, found nothing to say, and said nothing. It
  # opened zero pull requests in its entire life, and the first anybody noticed
  # was PHP 8.4.27 landing fixes for two CVSS 9.2 unauthenticated RCEs
  # (CVE-2026-109618, CVE-2026-109619) with a deployment still serving 8.4.26
  # three days later.
  #
  # This is the same failure as the render-service gap above, one layer down:
  # there, a directory nothing covered; here, a tag nothing could move. Both
  # read as "configured" on inspection.
  #
  # tests/Ops/BaseImagePinTest.php now fails if the Dockerfile goes back to a
  # floating tag, because the pin and this entry are one mechanism, not two.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
