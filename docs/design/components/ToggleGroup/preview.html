<!-- @dsCard group="Actions" height=230 subtitle="Pressed is the tint, in the main colour" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toggle group</title><style>#root{padding:16px 24px} .cap{font-size:.75rem;color:var(--muted-foreground);margin:0 0 6px} .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 32px;align-items:start} .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start} .ar{font-family:var(--font-arabic)} .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.Whity, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  function col() { return h.apply(null, ['div', { style: { display: 'grid', gap: 12, alignContent: 'start' } }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid2' },
    col(cap('One at a time: the view'), h(W.ToggleGroup, { label: 'View', defaultValue: 'list', required: true, options: [{ value: 'list', label: 'List', icon: 'form' }, { value: 'board', label: 'Board', icon: 'dashboard' }, { value: 'calendar', label: 'Calendar', icon: 'calendar' }] }),
      cap('Icons only, with tooltips'), h(W.ToggleGroup, { label: 'Show', size: 'sm', defaultValue: 'list', required: true, options: [{ value: 'list', label: 'List', icon: 'form', iconOnly: true }, { value: 'board', label: 'Board', icon: 'dashboard', iconOnly: true }, { value: 'chart', label: 'Chart', icon: 'chart', iconOnly: true }] })),
    col(cap('Any number: filters'), h(W.ToggleGroup, { label: 'Status', type: 'multiple', defaultValue: ['unpaid', 'overdue'], options: [{ value: 'paid', label: 'Paid' }, { value: 'unpaid', label: 'Unpaid' }, { value: 'overdue', label: 'Overdue' }, { value: 'draft', label: 'Draft', disabled: true }] }),
      cap('بالعربية'), h('div', { dir: 'rtl', lang: 'ar', className: 'ar' }, h(W.ToggleGroup, { label: 'العرض', defaultValue: 'list', required: true, options: [{ value: 'list', label: 'قائمة', icon: 'form' }, { value: 'board', label: 'لوحة', icon: 'dashboard' }, { value: 'calendar', label: 'تقويم', icon: 'calendar' }] })))));
</script>
</body>
</html>
