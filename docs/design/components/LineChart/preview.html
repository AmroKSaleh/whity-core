<!-- @dsCard group="Data" height=360 subtitle="A crosshair that lists every series" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Line chart</title><style>#root{padding:16px 24px} .cap{font-size:.75rem;color:var(--muted-foreground);margin:0 0 6px} .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 32px;align-items:start} .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start} .ar{font-family:var(--font-arabic)} .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.Whity, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  function col() { return h.apply(null, ['div', { style: { display: 'grid', gap: 12, alignContent: 'start' } }].concat([].slice.call(arguments))); }
  var wk = ['5 Aug','12 Aug','19 Aug','26 Aug','2 Sep','9 Sep','16 Sep','23 Sep','30 Sep','7 Oct','14 Oct','21 Oct'];
  var sent = [22,25,24,30,28,33,35,31,38,41,39,44], paid = [18,21,19,24,25,27,29,28,31,34,35,37], cash = [2.1,2.4,2.2,2.9,3.0,3.3,3.4,3.1,3.8,4.1,4.0,4.6];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid2' },
    h('div', { className: 'panel' }, h(W.LineChart, { title: 'Invoices per week', series: [{ key: 'sent', label: 'Sent' }, { key: 'paid', label: 'Paid' }], data: wk.map(function (l, i) { return { label: l, sent: sent[i], paid: paid[i] }; }), height: 220 })),
    h('div', { className: 'panel' }, h(W.LineChart, { title: 'Cash collected', subtitle: 'JOD thousands per week', area: true, format: function (v) { return v.toFixed(1) + 'K'; }, data: wk.map(function (l, i) { return { label: l, value: cash[i] }; }), height: 220 }))));
</script>
</body>
</html>
