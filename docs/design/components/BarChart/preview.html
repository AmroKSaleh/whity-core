<!-- @dsCard group="Data" height=380 subtitle="One series or grouped; the highest bar labelled" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Bar chart</title><style>#root{padding:16px 24px} .cap{font-size:.75rem;color:var(--muted-foreground);margin:0 0 6px} .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 32px;align-items:start} .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start} .ar{font-family:var(--font-arabic)} .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px}</style></head>
<body>
<div id="root"></div>
<script>
  var W = window.Whity, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  function col() { return h.apply(null, ['div', { style: { display: 'grid', gap: 12, alignContent: 'start' } }].concat([].slice.call(arguments))); }
  var fmt = function (v) { return 'JOD ' + Math.round(v).toLocaleString('en-US'); };
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid2' },
    h('div', { className: 'panel' }, h(W.BarChart, { title: 'Revenue', subtitle: 'Example Bakery, last 6 months', valueLabel: 'Revenue', format: fmt, data: [{ label: 'May', value: 3120 }, { label: 'Jun', value: 3480 }, { label: 'Jul', value: 2950 }, { label: 'Aug', value: 4010 }, { label: 'Sep', value: 4380 }, { label: 'Oct', value: 4860 }], height: 220 })),
    h('div', { className: 'panel' }, h(W.BarChart, { title: 'Invoices by branch', subtitle: 'October', series: [{ key: 'sent', label: 'Sent' }, { key: 'paid', label: 'Paid' }], data: [{ label: 'Abdoun', sent: 64, paid: 51 }, { label: 'Sweifieh', sent: 48, paid: 44 }, { label: 'Jabal Amman', sent: 37, paid: 22 }, { label: 'Zarqa', sent: 21, paid: 18 }], height: 220, label: false }))));
</script>
</body>
</html>
