<!doctype html>
<html>
<head><meta charset="utf-8"><title>DataTable</title><style>#root{padding:16px 24px}</style></head>
<body>
<div id="root" class=""></div>
<script>
  var W = window.Whity, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(W.DataTable, { columns: [{ key: 'name', label: 'Tenant' }, { key: 'plan', label: 'Plan', render: function (r) { return h(W.Badge, { variant: 'outline' }, r.plan); } }, { key: 'users', label: 'Users', align: 'end' }, { key: 'status', label: 'Status', render: function (r) { return h(W.Badge, { variant: r.status === 'Active' ? 'success' : 'warning' }, r.status); } }, { key: 'mrr', label: 'Monthly', align: 'end', render: function (r) { return h(W.Money, { amount: r.mrr }); } }],
    rows: [{ id: 1, name: 'Example Bakery', plan: 'Pro', users: 12, status: 'Active', mrr: 49 }, { id: 2, name: 'Example Trading', plan: 'Free', users: 3, status: 'Trial', mrr: 0 }, { id: 3, name: 'Example Clinic', plan: 'Pro', users: 28, status: 'Active', mrr: 89 }],
    footer: h(W.Pagination, { from: 1, to: 3, total: 3 }) }));
</script>
</body>
</html>
