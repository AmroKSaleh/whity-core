<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../../preview-runtime/react.production.min.js"></script><script src="../../preview-runtime/react-dom.production.min.js"></script><script src="../bundle.js"></script><script>(function(){var t=(location.hash.match(/theme=(dark|light)/)||[])[1]||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script><style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);width:960px;min-height:390px}</style><meta charset="utf-8"><title>File upload</title><style>#root{padding:16px 24px} .cap{font-size:.75rem;color:var(--muted-foreground);margin:0 0 6px} .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 32px;align-items:start} .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start} .ar{font-family:var(--font-arabic)} .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px}</style></head>

<div id="root"></div>
<script>
  var W = window.Whity, h = React.createElement;

      { name: 'Shop photo.heic', size: 3100000, status: 'error', error: 'HEIC files can’t be attached. Use PNG or JPG.' }] })),
    col(h('div', { dir: 'rtl', lang: 'ar', className: 'ar' }, h(W.FileUpload, { label: 'المرفقات', typesLabel: 'PDF أو PNG', maxSizeLabel: '10 MB', labels: { drop: 'أفلت الملفات هنا أو', browse: 'اختر ملفات', limits: '{types} حتى {size} لكل ملف', done: 'تم الرفع', remove: 'إزالة {name}' }, files: [{ name: 'عقد الإيجار.pdf', size: 912000, status: 'done' }] })))));
