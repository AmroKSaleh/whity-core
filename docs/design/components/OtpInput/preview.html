<!doctype html>
<html>
<head><meta charset="utf-8"><title>OtpInput</title><style>#root{padding:16px 24px} .cap{font-size:.75rem;color:var(--muted-foreground);margin:0 0 6px} .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 32px;align-items:start} .ar{font-family:var(--font-arabic)} </style></head>
<body>
<div id="root" class=""></div>
<script>
  var W = window.Whity, h = React.createElement; 
  function cap(t) { return h('p', { className: 'cap' }, t); }
  function col() { return h.apply(null, ['div', { style: { display: 'grid', gap: 12, alignContent: 'start' } }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid2' },
  col(h(W.OtpInput, { label: 'Code from your authenticator app', defaultValue: '4827', helperText: 'Paste or type the 6 digits.' })),
  col(h(W.OtpInput, { label: 'Code we sent to +962 7• ••• 4410', defaultValue: '482791', errorText: 'That code didn’t work. Check the latest SMS or send a new one.' }))));
</script>
</body>
</html>
