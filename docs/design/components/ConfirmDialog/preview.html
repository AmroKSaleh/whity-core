<!doctype html>
<html>
<head><meta charset="utf-8"><title>ConfirmDialog</title><style>#root{padding:16px 24px} .cap{font-size:.75rem;color:var(--muted-foreground);margin:0 0 6px} .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 32px;align-items:start} .ar{font-family:var(--font-arabic)} .wy-confirm__list{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:.875rem}</style></head>
<body>
<div id="root" class=""></div>
<script>
  var W = window.Whity, h = React.createElement; 
  function cap(t) { return h('p', { className: 'cap' }, t); }
  function col() { return h.apply(null, ['div', { style: { display: 'grid', gap: 12, alignContent: 'start' } }].concat([].slice.call(arguments))); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(W.ConfirmDialog, { inline: true, title: 'Delete Example Bakery?', description: 'This deletes the workspace for everyone in it. It can’t be undone.', confirmText: 'Example Bakery', defaultTyped: 'Example Bak', confirmLabel: 'Delete workspace', icon: 'delete' },
  h('ul', { className: 'wy-confirm__list' }, h('li', null, '12 people lose access today'), h('li', null, '214 invoices, 38 quotes and 9 documents are deleted'), h('li', null, '3 agents stop and their credentials are revoked')),
  h(W.Alert, { variant: 'info', title: 'Download a copy first' }, 'Settings › Export makes a ZIP of everything.')));
</script>
</body>
</html>
